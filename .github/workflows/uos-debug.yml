name: Build for UOS (Production Stable)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
      version:
        description: 'Package version'
        required: false
        default: '1.116.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-3-dev libxkbfile-dev \
            libkrb5-dev libgbm-dev rpm libx11-dev libxss-dev libxtst-dev \
            libnss3-dev libasound2-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev \
            python3 git wget curl tree xz-utils \
            dpkg-dev fakeroot lintian

      - name: 🔧 Fix TypeScript scripts
        run: |
          echo 'console.log("Preinstall OK");' > build/npm/preinstall.js
          sed -i 's/"preinstall": "node build\/npm\/preinstall.ts"/"preinstall": "node build\/npm\/preinstall.js"/' package.json
          echo 'console.log("Postinstall OK");' > build/npm/postinstall.js
          sed -i 's/"postinstall": "node build\/npm\/postinstall.ts"/"postinstall": "node build\/npm\/postinstall.js"/' package.json

      - name: 📦 Install dependencies
        run: |
          echo "=========================================="
          echo "📦 Installing dependencies"
          echo "=========================================="
          npm install --legacy-peer-deps

      - name: 📦 Install build tools
        run: |
          npm install -g tsx
          npm install --legacy-peer-deps \
            ternary-stream vscode-gulp-watch esbuild jsonc-parser \
            gulp-merge-json gulp-tsb gulp-sourcemaps gulp-filter \
            gulp-rename gulp-sort 2>/dev/null || true

      - name: 🔧 Fix extensions.ts
        run: |
          cat > build/lib/extensions.ts << 'EOF'
          import { Stream } from "stream";
          const empty: any[] = [];
          function emptyStream(): Stream {
            const s = new Stream.Readable();
            s._read = () => s.push(null);
            return s;
          }
          export function isWebExtension(): boolean { return false; }
          export function getExtensionStream(): Stream { return emptyStream(); }
          export function getExtensionDownloadStream(): Stream { return emptyStream(); }
          export function packageMarketplaceExtensionsStream(): Stream { return emptyStream(); }
          export function packageNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageNonNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageExtensionsStream(): Stream { return emptyStream(); }
          export function packageCopilotExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotChatExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotAgentsExtensionStream(): Stream { return emptyStream(); }
          export function fromMarketplace(): any[] { return empty; }
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }
          export function buildExtensionMedia(): void {}
          export function compileExtensionMedia(): void {}
          export function buildExtensionMediaTask(done: any): void { done(); }
          export const builtInExtensions = empty;
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions = empty;
          export const shouldDownloadWebBuiltInExtensions = false;
          EOF
          echo 'export const builtInExtensions: any[] = [];
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions: any[] = [];
          export const shouldDownloadWebBuiltInExtensions = false;' > build/lib/builtInExtensions.ts
          echo 'import { Stream } from "stream";
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }' > build/lib/fetch.ts

      - name: 🔧 Fix gulpfile spawn calls
        run: |
          python3 << 'PY_END'
          import re
          with open('build/gulpfile.vscode.ts', 'r') as f:
              content = f.read()
          content = re.sub(r"spawn\('node'", "spawn('tsx'", content)
          content = re.sub(r'spawn\("node"', 'spawn("tsx"', content)
          content = re.sub(r"spawn\(process\.execPath", "spawn('tsx'", content)
          with open('build/gulpfile.vscode.ts', 'w') as f:
              f.write(content)
          print("spawn calls fixed")
          PY_END

      - name: 🔧 Replace copilot.ts
        run: |
          cat > build/lib/copilot.ts << 'EOF'
          export async function prepareBuiltInCopilotExtensionShims(extRoot: string): Promise<void> {
              console.log('Copilot extension shims preparation skipped for UOS build');
              return;
          }
          export function copyCopilotNativeDeps(productRoot: string): void {
              console.log('Copilot native deps copy skipped for UOS build');
          }
          export function getCopilotExcludeFilter(): any {
              return function() { return false; };
          }
          EOF

      - name: 🔧 Disable Crashpad
        run: |
          echo "Disabling Crashpad"
          python3 << 'PY_JSON_END'
          import json
          import os
          if os.path.exists('product.json'):
              with open('product.json', 'r') as f:
                  data = json.load(f)
              data['enableCrashReport'] = False
              if 'crashReporter' not in data:
                  data['crashReporter'] = {}
              data['crashReporter']['disabled'] = True
              with open('product.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print("product.json modified")
          PY_JSON_END

          mkdir -p src/vs/platform/crash/common
          cat > src/vs/platform/crash/common/crashService.ts << 'CRASH_EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/
          import { createDecorator } from '../../../base/common/instantiation.js';
          export const ICrashService = createDecorator<ICrashService>('crashService');
          export interface ICrashService { _serviceBrand: undefined; }
          export class CrashService implements ICrashService {
              declare readonly _serviceBrand: undefined;
              constructor() { console.log('Crash service disabled for UOS build'); }
          }
          CRASH_EOF
          echo "crashService.ts created"

      - name: ⚙️ Set env
        run: |
          echo "VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_ELECTRON_SKIP_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_PRELAUNCH=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_BUNDLED_EXTENSIONS=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTER=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTING=1" >> $GITHUB_ENV

      - name: 🔨 Build VSCode
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1
          export VSCODE_ELECTRON_SKIP_DOWNLOAD=1
          export VSCODE_SKIP_PRELAUNCH=1
          export VSCODE_SKIP_BUNDLED_EXTENSIONS=1
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          echo "Start: $(date)"
          npx tsx node_modules/gulp/bin/gulp.js vscode-linux-x64 --no-color
          echo "Done: $(date)"

      - name: 🔍 Verify build contents
        run: |
          echo "=========================================="
          echo "🔍 Verify build contents"
          echo "=========================================="

          BUILD_DIR=""
          for dir in "./VSCode-linux-x64" "./vscode/VSCode-linux-x64" "../VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              BUILD_DIR="$dir"
              echo "Found build directory: $BUILD_DIR"
              break
            fi
          done

          if [ -z "$BUILD_DIR" ]; then
            echo "Build directory not found!"
            exit 1
          fi

          TARGET_DIR="./tscode-uos-x64"
          if [ "$BUILD_DIR" != "$TARGET_DIR" ]; then
            echo "Renaming $BUILD_DIR to $TARGET_DIR"
            rm -rf "$TARGET_DIR"
            mv "$BUILD_DIR" "$TARGET_DIR"
          fi
          BUILD_DIR="$TARGET_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

          echo "Initial build size:"
          du -sh "$BUILD_DIR"

      - name: 📦 Copy node_modules to resources/app
        run: |
          echo "=========================================="
          echo "📦 Copy node_modules to resources/app"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"

          if [ ! -d "./node_modules" ]; then
            echo "❌ node_modules not found in root!"
            echo "Installing node_modules..."
            npm install --legacy-peer-deps
          fi

          echo "📌 Copying node_modules to $BUILD_DIR/resources/app/"
          rm -rf "$BUILD_DIR/resources/app/node_modules"
          cp -r ./node_modules "$BUILD_DIR/resources/app/"

          echo "✅ node_modules copied"

      - name: 🔥 Replace native modules with official version
        run: |
          echo "=========================================="
          echo "🔥 Replacing native modules with official version"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"

          echo "📌 Downloading official VSCode $VERSION for Linux x64..."
          wget -q --show-progress "https://update.code.visualstudio.com/$VERSION/linux-x64/stable" -O /tmp/official.tar.gz

          if [ $? -ne 0 ] || [ ! -s /tmp/official.tar.gz ]; then
            echo "⚠️ Failed to download version $VERSION, trying latest..."
            wget -q --show-progress https://update.code.visualstudio.com/latest/linux-x64/stable -O /tmp/official.tar.gz
          fi

          tar -xzf /tmp/official.tar.gz -C /tmp/ 2>/dev/null

          OFFICIAL_DIR=$(find /tmp -maxdepth 1 -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)
          if [ -z "$OFFICIAL_DIR" ]; then
            OFFICIAL_DIR=$(find /tmp -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)
          fi

          if [ -z "$OFFICIAL_DIR" ]; then
            echo "❌ Could not find official VSCode!"
            exit 1
          fi

          echo "✅ Official VSCode found at: $OFFICIAL_DIR"

          if [ -d "$OFFICIAL_DIR/resources/app/node_modules" ]; then
            echo "   Copying official node_modules..."
            if [ -d "$BUILD_DIR/resources/app/node_modules" ]; then
              mv "$BUILD_DIR/resources/app/node_modules" \
                 "$BUILD_DIR/resources/app/node_modules.bak"
            fi
            cp -r "$OFFICIAL_DIR/resources/app/node_modules" \
                  "$BUILD_DIR/resources/app/"
            echo "   ✅ node_modules replaced with official version"
          fi

          rm -rf /tmp/official.tar.gz
          rm -rf "$OFFICIAL_DIR"
          echo ""
          echo "✅ Native modules replacement completed"

      - name: 📂 Copy official Git extension
        run: |
          echo "=========================================="
          echo "📂 Copying official Git extension"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"

          if [ ! -f "/tmp/official.tar.gz" ]; then
            echo "📌 Downloading official VSCode $VERSION..."
            wget -q --show-progress "https://update.code.visualstudio.com/$VERSION/linux-x64/stable" -O /tmp/official.tar.gz
          fi

          tar -xzf /tmp/official.tar.gz -C /tmp/ 2>/dev/null
          OFFICIAL_DIR=$(find /tmp -maxdepth 1 -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)

          if [ -n "$OFFICIAL_DIR" ]; then
            echo "✅ Official VSCode found at: $OFFICIAL_DIR"

            if [ -d "$OFFICIAL_DIR/resources/app/extensions/git" ]; then
              echo "📌 Copying Git extension..."
              mkdir -p "$BUILD_DIR/resources/app/extensions"
              rm -rf "$BUILD_DIR/resources/app/extensions/git"
              cp -r "$OFFICIAL_DIR/resources/app/extensions/git" \
                    "$BUILD_DIR/resources/app/extensions/"
              echo "✅ Git extension copied"

              if [ -d "$OFFICIAL_DIR/resources/app/extensions/git/node_modules" ]; then
                echo "📌 Copying Git extension dependencies..."
                cp -r "$OFFICIAL_DIR/resources/app/extensions/git/node_modules" \
                      "$BUILD_DIR/resources/app/extensions/git/"
                echo "✅ Git extension dependencies copied"
              fi
            else
              echo "⚠️ Git extension not found in official build"
            fi
          fi

      - name: 📂 Copy all official extensions
        run: |
          echo "=========================================="
          echo "📂 Copying all official extensions"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"

          OFFICIAL_DIR=$(find /tmp -maxdepth 1 -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)

          if [ -n "$OFFICIAL_DIR" ] && [ -d "$OFFICIAL_DIR/resources/app/extensions" ]; then
            echo "📌 Copying all official extensions..."
            mkdir -p "$BUILD_DIR/resources/app/extensions"

            for ext in "$OFFICIAL_DIR/resources/app/extensions"/*; do
              if [ -d "$ext" ]; then
                ext_name=$(basename "$ext")
                if [ "$ext_name" != "git" ]; then
                  echo "   Copying: $ext_name"
                  cp -r "$ext" "$BUILD_DIR/resources/app/extensions/"
                fi
              fi
            done

            echo "✅ All extensions copied from official build"
            echo "📌 Extensions count: $(ls -1 $BUILD_DIR/resources/app/extensions | wc -l)"
          else
            echo "⚠️ Could not find official extensions"
          fi

      - name: 🧹 Deep cleanup for smaller package
        run: |
          echo "=========================================="
          echo "🧹 Deep cleanup for smaller package"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"
          cd "$BUILD_DIR/resources/app"

          echo "📌 Before cleanup: $(du -sh . | cut -f1)"

          # 1. 清理 node_modules
          echo ""
          echo "📌 Cleaning node_modules..."

          # 删除 .ts 文件（保留 .d.ts）
          find node_modules -name "*.ts" -type f ! -name "*.d.ts" -delete 2>/dev/null || true

          # 删除 .map 文件
          find node_modules -name "*.map" -type f -delete 2>/dev/null || true

          # 删除 .md 文件
          find node_modules -name "*.md" -type f -delete 2>/dev/null || true
          find node_modules -name "*.markdown" -type f -delete 2>/dev/null || true

          # 删除 LICENSE 等
          find node_modules -name "LICENSE*" -type f -delete 2>/dev/null || true
          find node_modules -name "COPYING*" -type f -delete 2>/dev/null || true
          find node_modules -name "NOTICE*" -type f -delete 2>/dev/null || true

          # 删除测试目录
          find node_modules -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "__tests__" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "spec" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "specs" -exec rm -rf {} + 2>/dev/null || true

          # 删除示例目录
          find node_modules -type d -name "example" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "examples" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "demo" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "demos" -exec rm -rf {} + 2>/dev/null || true

          # 删除 .git 目录
          find node_modules -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name ".github" -exec rm -rf {} + 2>/dev/null || true

          # 删除 .bin 目录
          find node_modules -type d -name ".bin" -exec rm -rf {} + 2>/dev/null || true

          # 2. 清理扩展
          echo ""
          echo "📌 Cleaning extensions..."
          cd extensions
          find . -name "*.ts" -type f ! -name "*.d.ts" -delete 2>/dev/null || true
          find . -name "*.map" -type f -delete 2>/dev/null || true
          find . -name "*.md" -type f -delete 2>/dev/null || true

          # 删除非 git 扩展的 node_modules
          for ext in */; do
            if [ "$ext" != "git/" ] && [ -d "$ext/node_modules" ]; then
              rm -rf "$ext/node_modules"
            fi
          done
          cd ..

          echo "📌 After cleanup: $(du -sh . | cut -f1)"
          cd -

      - name: 📄 Create launcher and config
        run: |
          echo "=========================================="
          echo "📄 Creating launcher and config"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"
          cd "$BUILD_DIR"

          # 复制配置文件
          [ -f "resources/app/package.json" ] && cp "resources/app/package.json" . && echo "✅ package.json"
          [ -f "resources/app/product.json" ] && cp "resources/app/product.json" . && echo "✅ product.json"

          # 找到可执行文件
          REAL_EXEC=""
          for name in code code-oss; do
            if [ -f "./$name" ]; then
              REAL_EXEC="$name"
              break
            fi
          done

          if [ -z "$REAL_EXEC" ]; then
            REAL_EXEC=$(find . -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.sh" ! -name "chrome-*" 2>/dev/null | head -1 | sed 's|^\./||')
          fi

          if [ -z "$REAL_EXEC" ]; then
            echo "❌ No executable found!"
            exit 1
          fi

          echo "✅ Found executable: $REAL_EXEC"

          if [ "$REAL_EXEC" != "tscode" ]; then
            mv "$REAL_EXEC" "tscode"
            echo "✅ Renamed to tscode"
          else
            echo "✅ Already named tscode"
          fi

          # ============================================================
          # 创建 bin 目录和 git-finder（必须在 BUILD_DIR 内）
          # ============================================================
          echo ""
          echo "📌 Creating bin directory and git-finder..."

          # 确保 bin 目录存在
          mkdir -p "$BUILD_DIR/bin"

          cat > "$BUILD_DIR/bin/git-finder" << 'GITFINDER'
          #!/bin/bash
          # Git auto-discovery for TSCode

          # 尝试多个常见路径
          for git_path in /usr/local/bin/git /usr/bin/git /usr/local/git/bin/git /opt/git/bin/git; do
            if [ -x "$git_path" ]; then
              export GIT_EXEC_PATH="$($git_path --exec-path 2>/dev/null || echo '')"
              export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
              export GIT_TERMINAL_PROMPT=0
              exec "$git_path" "$@"
              exit 0
            fi
          done

          # 尝试 PATH 中的 git
          if command -v git >/dev/null 2>&1; then
            GIT_PATH="$(command -v git)"
            export GIT_EXEC_PATH="$("$GIT_PATH" --exec-path 2>/dev/null || echo '')"
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
            export GIT_TERMINAL_PROMPT=0
            exec "$GIT_PATH" "$@"
            exit 0
          fi

          echo "ERROR: Git not found!" >&2
          exit 1
          GITFINDER

          chmod +x "$BUILD_DIR/bin/git-finder"

          # 验证 git-finder 是否创建成功
          if [ -f "$BUILD_DIR/bin/git-finder" ]; then
            echo "   ✅ git-finder created at $BUILD_DIR/bin/git-finder"
          else
            echo "   ❌ git-finder creation failed!"
            exit 1
          fi

          # 创建启动脚本
          echo ""
          echo "📌 Creating start script..."
          cat > start-tscode.sh << 'START_EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          export PATH="/usr/local/bin:/usr/bin:/bin:$SCRIPT_DIR/bin:$PATH"
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
          export GIT_TERMINAL_PROMPT=0

          # 查找 Git
          GIT_PATH=""
          for g in /usr/local/bin/git /usr/bin/git /usr/local/git/bin/git; do
            if [ -x "$g" ]; then
              GIT_PATH="$g"
              break
            fi
          done

          if [ -z "$GIT_PATH" ] && command -v git >/dev/null 2>&1; then
            GIT_PATH="$(command -v git)"
          fi

          if [ -n "$GIT_PATH" ]; then
            export GIT_EXEC_PATH="$($GIT_PATH --exec-path 2>/dev/null || echo '')"
            echo "✅ Git found: $GIT_PATH" > /tmp/tscode-git.log
          else
            echo "⚠️ Git not found" > /tmp/tscode-git.log
          fi

          export ELECTRON_ENABLE_GPU=0
          export LIBGL_ALWAYS_SOFTWARE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ELECTRON_DISABLE_SANDBOX=1
          export GDK_BACKEND=x11
          export QT_QPA_PLATFORM=xcb
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          export CRASHPAD_DISABLE=1
          export VSCODE_APP_NAME="TSCode"
          export VSCODE_APP_VERSION="1.116.0"

          if [ -f "$SCRIPT_DIR/tscode" ]; then
            EXEC="$SCRIPT_DIR/tscode"
          else
            echo "TSCode executable not found!"
            exit 1
          fi

          echo "=== TSCode for UOS ==="
          echo "Starting TSCode..."

          exec "$EXEC" \
              --no-sandbox \
              --disable-gpu-sandbox \
              --disable-software-rasterizer \
              --disable-gpu \
              "$@"
          START_EOF

          chmod +x start-tscode.sh
          chmod +x tscode
          chmod +x chrome-sandbox 2>/dev/null || true

          # 创建桌面文件
          cat > tscode.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=TSCode
          Comment=Code Editing. Redefined.
          Exec=./tscode %F
          Icon=./resources/app/resources/linux/code.png
          Terminal=false
          Categories=Development;IDE;
          MimeType=text/plain;inode/directory;
          StartupNotify=true
          StartupWMClass=Code
          EOF

          echo ""
          echo "✅ Launcher and config created"

          # 最终验证
          echo ""
          echo "📌 Final verification:"
          ls -la "$BUILD_DIR/bin/" 2>/dev/null || echo "   bin directory not found!"
          ls -la "$BUILD_DIR/start-tscode.sh" 2>/dev/null || echo "   start-tscode.sh not found!"

      - name: 📄 Create default Git configuration
        run: |
          echo "=========================================="
          echo "📄 Creating default Git configuration"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"

          mkdir -p "$BUILD_DIR/resources/app/user-data"
          cat > "$BUILD_DIR/resources/app/user-data/settings.json" << 'GITCONFIG'
          {
            "git.enabled": true,
            "git.path": "/usr/bin/git",
            "git.autoRepositoryDetection": true,
            "git.repositoryScanMaxDepth": 2,
            "git.verbose": false,
            "git.logLevel": "error",
            "git.allowUnsigned": false,
            "git.enableSmartCommit": true,
            "git.enableCommitSigning": false,
            "git.statusLimit": 10000,
            "git.detectSubmodules": false,
            "git.submoduleIgnore": "all",
            "git.useForcePushWithLease": true,
            "files.watcherExclude": {
              "**/.git/objects/**": true,
              "**/.git/subtree-cache/**": true,
              "**/node_modules/**": true,
              "**/bower_components/**": true,
              "**/vendor/**": true,
              "**/target/**": true
            }
          }
          GITCONFIG

          echo "✅ Default Git configuration created"

      - name: 📄 Create validation script
        run: |
          echo "=========================================="
          echo "📄 Creating validation script"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"

          cat > "$BUILD_DIR/validate.sh" << 'VALIDATE_EOF'
          #!/bin/bash
          echo "=========================================="
          echo "TSCode Validation Script"
          echo "=========================================="

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PASSED=0
          FAILED=0

          echo ""
          echo "1️⃣ Checking main executable..."
          if [ -x "$SCRIPT_DIR/tscode" ]; then
            echo "   ✅ tscode executable"
            ((PASSED++))
          else
            echo "   ❌ tscode not executable"
            ((FAILED++))
          fi

          echo ""
          echo "2️⃣ Checking Chrome sandbox..."
          if [ -f "$SCRIPT_DIR/chrome-sandbox" ]; then
            PERMS=$(stat -c %a "$SCRIPT_DIR/chrome-sandbox" 2>/dev/null || echo "000")
            if [ "$PERMS" = "4755" ]; then
              echo "   ✅ chrome-sandbox SUID: 4755"
              ((PASSED++))
            else
              echo "   ⚠️ chrome-sandbox permissions: $PERMS (expected: 4755)"
              ((FAILED++))
            fi
          else
            echo "   ❌ chrome-sandbox not found"
            ((FAILED++))
          fi

          echo ""
          echo "3️⃣ Checking Git integration..."
          if [ -x "$SCRIPT_DIR/bin/git-finder" ]; then
            echo "   ✅ git-finder executable"
            ((PASSED++))

            if "$SCRIPT_DIR/bin/git-finder" --version > /dev/null 2>&1; then
              GIT_VERSION="$("$SCRIPT_DIR/bin/git-finder" --version 2>&1)"
              echo "   ✅ Git found: $GIT_VERSION"
              ((PASSED++))
            else
              echo "   ❌ Git not working"
              ((FAILED++))
            fi
          else
            echo "   ❌ git-finder not found"
            ((FAILED++))
          fi

          echo ""
          echo "4️⃣ Checking Git extension..."
          if [ -d "$SCRIPT_DIR/resources/app/extensions/git" ]; then
            echo "   ✅ Git extension exists"
            ((PASSED++))

            if [ -f "$SCRIPT_DIR/resources/app/extensions/git/out/main.js" ]; then
              echo "   ✅ Git extension compiled"
              ((PASSED++))
            else
              echo "   ⚠️ Git extension may not be compiled"
            fi
          else
            echo "   ❌ Git extension missing"
            ((FAILED++))
          fi

          echo ""
          echo "5️⃣ Checking node_modules..."
          if [ -d "$SCRIPT_DIR/resources/app/node_modules" ]; then
            SIZE=$(du -sh "$SCRIPT_DIR/resources/app/node_modules" | cut -f1)
            COUNT=$(find "$SCRIPT_DIR/resources/app/node_modules" -type f | wc -l)
            echo "   ✅ node_modules: $COUNT files, $SIZE"
            ((PASSED++))
          else
            echo "   ❌ node_modules missing"
            ((FAILED++))
          fi

          echo ""
          echo "6️⃣ Testing Git repository..."
          TEST_DIR="/tmp/tscode-validate-$$"
          mkdir -p "$TEST_DIR"
          cd "$TEST_DIR"

          if "$SCRIPT_DIR/bin/git-finder" init > /dev/null 2>&1; then
            echo "test" > test.txt
            "$SCRIPT_DIR/bin/git-finder" add test.txt > /dev/null 2>&1
            "$SCRIPT_DIR/bin/git-finder" commit -m "test" > /dev/null 2>&1
            if "$SCRIPT_DIR/bin/git-finder" status > /dev/null 2>&1; then
              echo "   ✅ Git repository operations working"
              ((PASSED++))
            else
              echo "   ❌ Git status failed"
              ((FAILED++))
            fi
          else
            echo "   ❌ Git init failed"
            ((FAILED++))
          fi

          cd /
          rm -rf "$TEST_DIR"

          echo ""
          echo "=========================================="
          echo "Validation Results:"
          echo "   ✅ Passed: $PASSED"
          echo "   ❌ Failed: $FAILED"
          echo "=========================================="

          if [ $FAILED -eq 0 ]; then
            echo "✅ All checks passed! TSCode is ready."
            exit 0
          else
            echo "❌ Some checks failed. Please review above."
            exit 1
          fi
          VALIDATE_EOF

          chmod +x "$BUILD_DIR/validate.sh"
          echo "✅ Validation script created"

      - name: 🔍 Run validation before packaging
        run: |
          echo "=========================================="
          echo "🔍 Running validation before packaging"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"

          if ! "$BUILD_DIR/validate.sh"; then
            echo "❌ Validation failed!"
            exit 1
          fi

          echo "✅ Validation passed!"

      - name: 📦 Package and verify
        run: |
          echo "=========================================="
          echo "📦 Package and verify"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"

          # 修复所有权限
          echo "📌 Fixing permissions..."
          find "$BUILD_DIR" -type f -exec chmod 644 {} \;
          find "$BUILD_DIR" -type d -exec chmod 755 {} \;

          chmod +x "$BUILD_DIR/tscode" 2>/dev/null || true
          chmod +x "$BUILD_DIR/start-tscode.sh" 2>/dev/null || true
          chmod +x "$BUILD_DIR/chrome-sandbox" 2>/dev/null || true
          chmod +x "$BUILD_DIR/bin/git-finder" 2>/dev/null || true
          chmod +x "$BUILD_DIR/validate.sh" 2>/dev/null || true

          find "$BUILD_DIR" -name "*.node" -exec chmod 644 {} \;

          echo ""
          echo "📌 Pre-package validation:"
          echo "   node_modules: $(if [ -d $BUILD_DIR/resources/app/node_modules ]; then echo 'OK'; else echo 'MISSING!'; fi)"
          echo "   extensions: $(ls -la $BUILD_DIR/resources/app/extensions/ 2>/dev/null | wc -l)"
          echo "   git extension: $(if [ -d $BUILD_DIR/resources/app/extensions/git ]; then echo 'OK'; else echo 'MISSING!'; fi)"

          echo ""
          echo "📌 Creating package (gzip)..."

          tar -czf "tscode-${VERSION}.tar.gz" \
            --no-same-owner \
            --no-same-permissions \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$(dirname "$BUILD_DIR")" \
            "$(basename "$BUILD_DIR")"

          echo ""
          echo "📌 Verifying package contents..."
          mkdir -p /tmp/verify
          tar -xzf "tscode-${VERSION}.tar.gz" -C /tmp/verify

          if [ -x "/tmp/verify/$(basename "$BUILD_DIR")/validate.sh" ]; then
            echo "   ✅ Validation script exists in package"
          else
            echo "   ❌ Validation script missing from package"
            exit 1
          fi

          sha256sum "tscode-${VERSION}.tar.gz" > "tscode-${VERSION}.tar.gz.sha256"

          echo ""
          echo "✅ Package created and verified:"
          ls -lh tscode-${VERSION}.tar.gz
          echo ""
          echo "📌 Package size: $(du -sh tscode-${VERSION}.tar.gz | cut -f1)"

          rm -rf /tmp/verify

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tscode-uos
          path: |
            tscode-*.tar.gz
            tscode-*.tar.gz.sha256
          retention-days: 30

      - name: 📊 Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "📊 BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ github.event.inputs.version || '1.116.0' }}"
          echo "=========================================="

          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully!"
            echo ""
            echo "📦 Packages available:"
            ls -lh tscode-*.*
            echo ""
            echo "📖 Installation:"
            echo "  1. tar -xzf tscode-*.tar.gz"
            echo "  2. cd tscode-uos-x64"
            echo "  3. ./validate.sh  (verify installation)"
            echo "  4. ./start-tscode.sh"
            echo ""
            echo "🔍 Git features verified:"
            echo "  - Git extension included ✅"
            echo "  - git-finder auto-discovery ✅"
            echo "  - Git configuration pre-set ✅"
            echo "  - Git repository operations tested ✅"
            echo "=========================================="
          else
            echo ""
            echo "❌ Build failed. Check logs for details."
            echo "=========================================="
          fi