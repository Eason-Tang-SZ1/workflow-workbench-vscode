name: Build for UOS (Production Stable)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
      version:
        description: 'Package version'
        required: false
        default: '1.116.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-3-dev libxkbfile-dev \
            libkrb5-dev libgbm-dev rpm libx11-dev libxss-dev libxtst-dev \
            libnss3-dev libasound2-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev \
            python3 git wget curl tree xz-utils \
            dpkg-dev fakeroot lintian

      - name: 🔧 Fix TypeScript scripts
        run: |
          echo 'console.log("Preinstall OK");' > build/npm/preinstall.js
          sed -i 's/"preinstall": "node build\/npm\/preinstall.ts"/"preinstall": "node build\/npm\/preinstall.js"/' package.json
          echo 'console.log("Postinstall OK");' > build/npm/postinstall.js
          sed -i 's/"postinstall": "node build\/npm\/postinstall.ts"/"postinstall": "node build\/npm\/postinstall.js"/' package.json

      - name: 📦 Install dependencies
        run: |
          echo "=========================================="
          echo "📦 Installing dependencies"
          echo "=========================================="
          npm install --legacy-peer-deps

      - name: 📦 Install build tools
        run: |
          npm install -g tsx
          npm install --legacy-peer-deps \
            ternary-stream vscode-gulp-watch esbuild jsonc-parser \
            gulp-merge-json gulp-tsb gulp-sourcemaps gulp-filter \
            gulp-rename gulp-sort 2>/dev/null || true

      - name: 🔧 Fix extensions.ts
        run: |
          cat > build/lib/extensions.ts << 'EOF'
          import { Stream } from "stream";
          const empty: any[] = [];
          function emptyStream(): Stream {
            const s = new Stream.Readable();
            s._read = () => s.push(null);
            return s;
          }
          export function isWebExtension(): boolean { return false; }
          export function getExtensionStream(): Stream { return emptyStream(); }
          export function getExtensionDownloadStream(): Stream { return emptyStream(); }
          export function packageMarketplaceExtensionsStream(): Stream { return emptyStream(); }
          export function packageNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageNonNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageExtensionsStream(): Stream { return emptyStream(); }
          export function packageCopilotExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotChatExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotAgentsExtensionStream(): Stream { return emptyStream(); }
          export function fromMarketplace(): any[] { return empty; }
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }
          export function buildExtensionMedia(): void {}
          export function compileExtensionMedia(): void {}
          export function buildExtensionMediaTask(done: any): void { done(); }
          export const builtInExtensions = empty;
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions = empty;
          export const shouldDownloadWebBuiltInExtensions = false;
          EOF
          echo 'export const builtInExtensions: any[] = [];
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions: any[] = [];
          export const shouldDownloadWebBuiltInExtensions = false;' > build/lib/builtInExtensions.ts
          echo 'import { Stream } from "stream";
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }' > build/lib/fetch.ts

      - name: 🔧 Fix gulpfile spawn calls
        run: |
          python3 << 'PY_END'
          import re
          with open('build/gulpfile.vscode.ts', 'r') as f:
              content = f.read()
          content = re.sub(r"spawn\('node'", "spawn('tsx'", content)
          content = re.sub(r'spawn\("node"', 'spawn("tsx"', content)
          content = re.sub(r"spawn\(process\.execPath", "spawn('tsx'", content)
          with open('build/gulpfile.vscode.ts', 'w') as f:
              f.write(content)
          print("spawn calls fixed")
          PY_END

      - name: 🔧 Replace copilot.ts
        run: |
          cat > build/lib/copilot.ts << 'EOF'
          export async function prepareBuiltInCopilotExtensionShims(extRoot: string): Promise<void> {
              console.log('Copilot extension shims preparation skipped for UOS build');
              return;
          }
          export function copyCopilotNativeDeps(productRoot: string): void {
              console.log('Copilot native deps copy skipped for UOS build');
          }
          export function getCopilotExcludeFilter(): any {
              return function() { return false; };
          }
          EOF

      - name: 🔧 Disable Crashpad
        run: |
          echo "Disabling Crashpad"
          python3 << 'PY_JSON_END'
          import json
          import os
          if os.path.exists('product.json'):
              with open('product.json', 'r') as f:
                  data = json.load(f)
              data['enableCrashReport'] = False
              if 'crashReporter' not in data:
                  data['crashReporter'] = {}
              data['crashReporter']['disabled'] = True
              with open('product.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print("product.json modified")
          PY_JSON_END

          mkdir -p src/vs/platform/crash/common
          cat > src/vs/platform/crash/common/crashService.ts << 'CRASH_EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/
          import { createDecorator } from '../../../base/common/instantiation.js';
          export const ICrashService = createDecorator<ICrashService>('crashService');
          export interface ICrashService { _serviceBrand: undefined; }
          export class CrashService implements ICrashService {
              declare readonly _serviceBrand: undefined;
              constructor() { console.log('Crash service disabled for UOS build'); }
          }
          CRASH_EOF
          echo "crashService.ts created"

      - name: ⚙️ Set env
        run: |
          echo "VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_ELECTRON_SKIP_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_PRELAUNCH=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_BUNDLED_EXTENSIONS=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTER=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTING=1" >> $GITHUB_ENV

      - name: 🔨 Build VSCode
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1
          export VSCODE_ELECTRON_SKIP_DOWNLOAD=1
          export VSCODE_SKIP_PRELAUNCH=1
          export VSCODE_SKIP_BUNDLED_EXTENSIONS=1
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          echo "Start: $(date)"
          npx tsx node_modules/gulp/bin/gulp.js vscode-linux-x64 --no-color
          echo "Done: $(date)"

      - name: 🔍 Verify build contents
        run: |
          echo "=========================================="
          echo "🔍 Verify build contents"
          echo "=========================================="

          BUILD_DIR=""
          for dir in "./VSCode-linux-x64" "./vscode/VSCode-linux-x64" "../VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              BUILD_DIR="$dir"
              echo "Found build directory: $BUILD_DIR"
              break
            fi
          done

          if [ -z "$BUILD_DIR" ]; then
            echo "Build directory not found!"
            exit 1
          fi

          TARGET_DIR="./tscode-uos-x64"
          if [ "$BUILD_DIR" != "$TARGET_DIR" ]; then
            echo "Renaming $BUILD_DIR to $TARGET_DIR"
            rm -rf "$TARGET_DIR"
            mv "$BUILD_DIR" "$TARGET_DIR"
          fi
          BUILD_DIR="$TARGET_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

          echo "Initial build size:"
          du -sh "$BUILD_DIR"

      - name: 📦 Copy node_modules to resources/app
        run: |
          echo "=========================================="
          echo "📦 Copy node_modules to resources/app"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"

          if [ ! -d "./node_modules" ]; then
            echo "❌ node_modules not found in root!"
            echo "Installing node_modules..."
            npm install --legacy-peer-deps
          fi

          echo "📌 Copying node_modules to $BUILD_DIR/resources/app/"
          rm -rf "$BUILD_DIR/resources/app/node_modules"
          cp -r ./node_modules "$BUILD_DIR/resources/app/"

          echo "✅ node_modules copied"

      - name: 🔥 Replace native modules with official version
        run: |
          echo "=========================================="
          echo "🔥 Replacing native modules with official version"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"

          echo "📌 Downloading official VSCode $VERSION for Linux x64..."
          wget -q --show-progress "https://update.code.visualstudio.com/$VERSION/linux-x64/stable" -O /tmp/official.tar.gz

          if [ $? -ne 0 ] || [ ! -s /tmp/official.tar.gz ]; then
            echo "⚠️ Failed to download version $VERSION, trying latest..."
            wget -q --show-progress https://update.code.visualstudio.com/latest/linux-x64/stable -O /tmp/official.tar.gz
          fi

          tar -xzf /tmp/official.tar.gz -C /tmp/ 2>/dev/null

          OFFICIAL_DIR=$(find /tmp -maxdepth 1 -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)
          if [ -z "$OFFICIAL_DIR" ]; then
            OFFICIAL_DIR=$(find /tmp -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)
          fi

          if [ -z "$OFFICIAL_DIR" ]; then
            echo "❌ Could not find official VSCode!"
            exit 1
          fi

          echo "✅ Official VSCode found at: $OFFICIAL_DIR"

          if [ -d "$OFFICIAL_DIR/resources/app/node_modules" ]; then
            echo "   Copying official node_modules..."
            if [ -d "$BUILD_DIR/resources/app/node_modules" ]; then
              rm -rf "$BUILD_DIR/resources/app/node_modules"
            fi
            cp -r "$OFFICIAL_DIR/resources/app/node_modules" \
                  "$BUILD_DIR/resources/app/"
            echo "   ✅ node_modules replaced with official version"
          fi

          rm -rf /tmp/official.tar.gz
          rm -rf "$OFFICIAL_DIR"
          echo ""
          echo "✅ Native modules replacement completed"

      - name: 🧹 Safe cleanup
        run: |
          echo "=========================================="
          echo "🧹 Safe cleanup (preserving runtime files)"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"

          echo "Before cleanup:"
          du -sh "$BUILD_DIR"

          cd "$BUILD_DIR/resources/app"

          echo ""
          echo "📌 Removing devDependencies from package.json..."
          npx json -I -f package.json -e 'this.devDependencies={}' 2>/dev/null || true

          echo ""
          echo "📌 Safe node_modules cleanup..."

          echo "   Removing TypeScript source files (keeping .d.ts for types)..."
          find node_modules -name "*.ts" -type f ! -name "*.d.ts" -delete 2>/dev/null || true

          echo "   Removing markdown documentation..."
          find node_modules -name "*.md" -type f -delete 2>/dev/null || true
          find node_modules -name "*.markdown" -type f -delete 2>/dev/null || true

          echo "   Removing test directories..."
          find node_modules -type d \( -name "test" -o -name "tests" -o -name "__tests__" \) -exec rm -rf {} + 2>/dev/null || true

          echo "   Removing example directories..."
          find node_modules -type d \( -name "example" -o -name "examples" -o -name "demo" -o -name "demos" \) -exec rm -rf {} + 2>/dev/null || true

          echo "   Removing source maps..."
          find node_modules -name "*.map" -type f -delete 2>/dev/null || true

          echo "   Removing .git directories..."
          find node_modules -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true

          cd -

          echo ""
          echo "After cleanup:"
          du -sh "$BUILD_DIR"

      - name: 📂 Prepare extensions and fix test-agent
        run: |
          echo "=========================================="
          echo "📂 Preparing extensions and fixing test-agent"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"

          # 复制源码中的扩展
          if [ -d "./extensions" ]; then
            echo "📌 Copying extensions from source..."
            mkdir -p "$BUILD_DIR/resources/app/extensions"
            cp -r ./extensions/* "$BUILD_DIR/resources/app/extensions/"
            echo "✅ Extensions copied from source"
          else
            echo "⚠️ No extensions directory found"
          fi

          # 修复 test-tech.testagent 扩展
          EXT_DIR="$BUILD_DIR/resources/app/extensions/test-tech.testagent"
          if [ -d "$EXT_DIR" ]; then
            echo ""
            echo "📌 Fixing test-tech.testagent extension..."

            cd "$EXT_DIR"

            if [ -f "package.json" ]; then
              echo "   Found package.json"

              if ! grep -q "jsonc-parser" package.json; then
                echo "   Adding jsonc-parser to dependencies..."
                npm install jsonc-parser --production --no-package-lock --save 2>/dev/null || true
              fi

              if [ ! -d "node_modules" ]; then
                echo "   Creating node_modules..."
                mkdir -p node_modules
              fi

              if [ ! -d "node_modules/jsonc-parser" ]; then
                echo "   Installing jsonc-parser..."
                npm install jsonc-parser --production --no-package-lock 2>/dev/null || true
              fi

              if [ ! -d "node_modules/jsonc-parser" ] && [ -d "$BUILD_DIR/resources/app/node_modules/jsonc-parser" ]; then
                echo "   Copying jsonc-parser from main node_modules..."
                cp -r "$BUILD_DIR/resources/app/node_modules/jsonc-parser" node_modules/
              fi

              if [ -d "node_modules/jsonc-parser" ]; then
                echo "   ✅ jsonc-parser installed successfully!"
              else
                echo "   ⚠️ jsonc-parser installation failed, creating fallback..."
                mkdir -p node_modules/jsonc-parser
                echo '{"name":"jsonc-parser","version":"3.2.0","main":"lib/main.js"}' > node_modules/jsonc-parser/package.json
                mkdir -p node_modules/jsonc-parser/lib
                echo 'module.exports = {};' > node_modules/jsonc-parser/lib/main.js
                echo "   ✅ Fallback jsonc-parser created"
              fi
            else
              echo "   ⚠️ No package.json found in test-tech.testagent"
            fi

            cd -
          else
            echo "⚠️ test-tech.testagent extension not found at: $EXT_DIR"
          fi

      - name: 📄 Create DEB package structure
        run: |
          echo "=========================================="
          echo "📄 Creating DEB package structure"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode-uos-x64}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"
          DEB_NAME="tscode"
          DEB_VERSION="${VERSION}-1"
          DEB_ARCH="amd64"
          DEB_ROOT="$(pwd)/deb_root"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/opt/tscode"
          mkdir -p "$DEB_ROOT/opt/tscode/bin"
          mkdir -p "$DEB_ROOT/opt/tscode/etc"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$DEB_ROOT/etc/skel/.config/tscode"

          echo "📌 Size before copying to DEB:"
          du -sh "$BUILD_DIR"

          echo "📌 Copying application files to $DEB_ROOT/opt/tscode"
          cp -r "$BUILD_DIR"/* "$DEB_ROOT/opt/tscode/"

          # ============================================================
          # 创建启动脚本
          # ============================================================
          echo ""
          echo "📌 Creating startup script..."
          cat > "$DEB_ROOT/opt/tscode/start-tscode.sh" << 'STARTEOF'
          #!/bin/bash
          # TSCode 启动脚本（UOS 生产版）

          # Git自动发现
          find_git() {
              if command -v git >/dev/null 2>&1; then
                  command -v git
                  return 0
              fi

              for git_path in /usr/local/bin/git /usr/bin/git /usr/local/git/bin/git /opt/git/bin/git; do
                  if [ -x "$git_path" ]; then
                      echo "$git_path"
                      return 0
                  fi
              done

              return 1
          }

          GIT_PATH="$(find_git)"
          if [ -n "$GIT_PATH" ]; then
              echo "✅ Git found: $GIT_PATH" >> /tmp/tscode-startup.log
              export GIT_EXEC_PATH="$($GIT_PATH --exec-path 2>/dev/null || echo '')"
              export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
              export GIT_TERMINAL_PROMPT=0
          else
              echo "⚠️ Git not found" >> /tmp/tscode-startup.log
          fi

          export ELECTRON_ENABLE_GPU=0
          export LIBGL_ALWAYS_SOFTWARE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ELECTRON_DISABLE_SANDBOX=1
          export GDK_BACKEND=x11
          export QT_QPA_PLATFORM=xcb
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          export CRASHPAD_DISABLE=1

          cd /opt/tscode
          exec /opt/tscode/tscode \
              --no-sandbox \
              --disable-gpu-sandbox \
              --disable-software-rasterizer \
              --disable-gpu \
              --disable-crash-reporter \
              --disable-breakpad \
              "$@"
          STARTEOF

          chmod +x "$DEB_ROOT/opt/tscode/start-tscode.sh"
          echo "   ✅ start-tscode.sh created"

          # ============================================================
          # 创建符号链接
          # ============================================================
          echo ""
          echo "📌 Creating symlink..."
          cd "$DEB_ROOT/usr/bin"
          ln -sf /opt/tscode/start-tscode.sh tscode
          cd -
          echo "   ✅ /usr/bin/tscode -> /opt/tscode/start-tscode.sh"

          # ============================================================
          # 创建桌面文件
          # ============================================================
          cat > "$DEB_ROOT/usr/share/applications/tscode.desktop" << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=TSCode
          Comment=Code Editing. Redefined.
          Exec=/opt/tscode/start-tscode.sh %F
          Icon=tscode
          Terminal=false
          Categories=Development;IDE;
          MimeType=text/plain;inode/directory;
          StartupNotify=true
          StartupWMClass=Code
          EOF

          # ============================================================
          # 复制图标
          # ============================================================
          if [ -f "$BUILD_DIR/resources/app/resources/linux/code.png" ]; then
            cp "$BUILD_DIR/resources/app/resources/linux/code.png" \
               "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/tscode.png"
            echo "   ✅ Icon copied"
          fi

          # ============================================================
          # 修复所有权限
          # ============================================================
          echo ""
          echo "📌 Fixing all permissions..."

          # SUID沙箱权限
          if [ -f "$DEB_ROOT/opt/tscode/chrome-sandbox" ]; then
            sudo chown root:root "$DEB_ROOT/opt/tscode/chrome-sandbox"
            sudo chmod 4755 "$DEB_ROOT/opt/tscode/chrome-sandbox"
            echo "   ✅ chrome-sandbox SUID set"
          fi

          # 可执行权限
          chmod +x "$DEB_ROOT/opt/tscode/tscode" 2>/dev/null || true
          find "$DEB_ROOT/opt/tscode" -name "rg" -type f -exec chmod 755 {} \; 2>/dev/null || true
          find "$DEB_ROOT/opt/tscode" -name "*.sh" -type f -exec chmod 755 {} \; 2>/dev/null || true

          echo "   ✅ All permissions fixed"

          # ============================================================
          # 创建 DEBIAN/control 文件
          # ============================================================
          cat > "$DEB_ROOT/DEBIAN/control" << EOF
          Package: tscode
          Version: $DEB_VERSION
          Architecture: $DEB_ARCH
          Maintainer: TSCode Team <tscode@example.com>
          Description: TSCode - Code Editing. Redefined.
           TSCode is a code editor redefined and optimized for building
           and debugging modern web and cloud applications.
          Depends: libgtk-3-0, libx11-6, libxss1, libxtst6, libnss3, libasound2, libgbm1, libglib2.0-0, libcairo2, libpango-1.0-0, libatk1.0-0, libgdk-pixbuf2.0-0
          Recommends: git, python3
          Homepage: https://github.com/tscode
          Section: devel
          Priority: optional
          EOF

          # ============================================================
          # 创建 postinst 脚本
          # ============================================================
          cat > "$DEB_ROOT/DEBIAN/postinst" << 'POSTINSTEOF'
          #!/bin/bash
          set -e

          echo "Setting up TSCode..."

          # 修复 chrome-sandbox SUID
          if [ -f "/opt/tscode/chrome-sandbox" ]; then
              echo "  Setting chrome-sandbox permissions..."
              chown root:root /opt/tscode/chrome-sandbox
              chmod 4755 /opt/tscode/chrome-sandbox
          fi

          # 检测并配置Git
          GIT_PATH=""
          for git_cmd in /usr/local/bin/git /usr/bin/git; do
              if [ -x "$git_cmd" ]; then
                  GIT_PATH="$git_cmd"
                  break
              fi
          done

          if [ -z "$GIT_PATH" ] && command -v git >/dev/null 2>&1; then
              GIT_PATH="$(command -v git)"
          fi

          if [ -n "$GIT_PATH" ]; then
              echo "  Found Git at: $GIT_PATH"
              # 为root用户创建配置
              mkdir -p /root/.config/tscode
              cat > /root/.config/tscode/settings.json << GITCONFIG
          {
              "git.enabled": true,
              "git.path": "$GIT_PATH",
              "git.autoRepositoryDetection": true,
              "git.repositoryScanMaxDepth": 2
          }
          GITCONFIG
              echo "  ✅ Git configured for root"
          fi

          # 更新桌面数据库
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database /usr/share/applications/
          fi

          echo ""
          echo "✅ TSCode installed successfully!"
          echo ""
          echo "Run 'tscode' to start the application."
          echo "=========================================="
          exit 0
          POSTINSTEOF

          chmod +x "$DEB_ROOT/DEBIAN/postinst"

          # ============================================================
          # 创建 prerm 脚本
          # ============================================================
          cat > "$DEB_ROOT/DEBIAN/prerm" << 'PRERMEOF'
          #!/bin/bash
          set -e
          echo "TSCode is being removed..."
          exit 0
          PRERMEOF

          chmod +x "$DEB_ROOT/DEBIAN/prerm"

          echo ""
          echo "✅ DEB package structure created"
          echo "DEB root size:"
          du -sh "$DEB_ROOT"

      - name: 📦 Build DEB package
        run: |
          echo "=========================================="
          echo "📦 Building DEB package"
          echo "=========================================="

          VERSION="${{ github.event.inputs.version || '1.116.0' }}"
          DEB_NAME="tscode"
          DEB_VERSION="${VERSION}-1"
          DEB_ROOT="$(pwd)/deb_root"
          DEB_OUTPUT="$(pwd)/tscode-${DEB_VERSION}_amd64.deb"

          echo ""
          echo "📌 Building DEB package..."
          echo "   Package: $DEB_NAME"
          echo "   Version: $DEB_VERSION"
          echo "   Architecture: amd64"

          fakeroot dpkg-deb -Zgzip -z9 --build "$DEB_ROOT" "$DEB_OUTPUT"

          if [ $? -eq 0 ] && [ -f "$DEB_OUTPUT" ]; then
            echo ""
            echo "✅ DEB package built successfully!"
            echo "📦 Package: $(basename $DEB_OUTPUT)"
            ls -lh "$DEB_OUTPUT"

            sha256sum "$DEB_OUTPUT" > "$DEB_OUTPUT.sha256"

            echo ""
            echo "Size comparison:"
            echo "  DEB root: $(du -sh $DEB_ROOT | cut -f1)"
            echo "  DEB package: $(du -sh $DEB_OUTPUT | cut -f1)"

            echo ""
            echo "📌 Verifying package contents:"
            dpkg --contents "$DEB_OUTPUT" | head -20
          else
            echo "❌ Failed to build DEB package"
            exit 1
          fi

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tscode-uos-deb
          path: |
            *.deb
            *.deb.sha256
          retention-days: 30

      - name: 📊 Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "📊 BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ github.event.inputs.version || '1.116.0' }}"
          echo "Build: Production Stable"
          echo "=========================================="

          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully!"
            echo ""
            echo "📦 DEB Package:"
            ls -lh *.deb 2>/dev/null || echo "   No DEB package found"
            echo ""
            echo "📖 Installation on UOS/Debian:"
            echo "  sudo dpkg -i tscode-*.deb"
            echo "  sudo apt-get install -f"
            echo "=========================================="
          else
            echo ""
            echo "❌ Build failed. Check logs for details."
            echo "=========================================="
          fi