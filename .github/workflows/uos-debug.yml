name: Build for Debian 10 (Debug Pure Source Build)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
      version:
        description: 'Package version'
        required: false
        default: '1.116.0'
      custom_extension_repo:
        description: 'Custom extension git repo URL (optional)'
        required: false
        default: ''
      custom_extension_branch:
        description: 'Custom extension branch (optional)'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: 📥 Download custom extension
        run: |
          echo "=========================================="
          echo "📥 Downloading custom extension"
          echo "=========================================="

          mkdir -p custom-extensions

          if [ -n "${{ github.event.inputs.custom_extension_repo }}" ]; then
            echo "📌 Cloning extension from: ${{ github.event.inputs.custom_extension_repo }}"
            git clone --depth 1 \
              --branch ${{ github.event.inputs.custom_extension_branch || 'main' }} \
              "${{ github.event.inputs.custom_extension_repo }}" \
              custom-extensions/my-extension
            echo "✅ Extension cloned"
          elif [ -d "./my-extension" ]; then
            echo "📌 Using local extension: ./my-extension"
            cp -r ./my-extension custom-extensions/
            echo "✅ Local extension copied"
          elif [ -f "./my-extension.vsix" ]; then
            echo "📌 Extracting VSIX: my-extension.vsix"
            mkdir -p custom-extensions/my-extension
            unzip -q ./my-extension.vsix -d custom-extensions/my-extension
            echo "✅ VSIX extracted"
          else
            echo "ℹ️ No custom extension provided"
          fi

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-3-dev libxkbfile-dev \
            libkrb5-dev libgbm-dev rpm libx11-dev libxss-dev libxtst-dev \
            libnss3-dev libasound2-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev \
            python3 git wget curl tree xz-utils \
            dpkg-dev fakeroot lintian jq

      - name: 🔧 Fix TypeScript scripts
        run: |
          echo 'console.log("Preinstall OK");' > build/npm/preinstall.js
          sed -i 's/"preinstall": "node build\/npm\/preinstall.ts"/"preinstall": "node build\/npm\/preinstall.js"/' package.json
          echo 'console.log("Postinstall OK");' > build/npm/postinstall.js
          sed -i 's/"postinstall": "node build\/npm\/postinstall.ts"/"postinstall": "node build\/npm\/postinstall.js"/' package.json

      - name: 📦 Install dependencies
        run: |
          echo "=========================================="
          echo "📦 Installing dependencies"
          echo "=========================================="
          npm install --legacy-peer-deps

      - name: 📦 Install build tools
        run: |
          npm install -g tsx
          npm install --legacy-peer-deps \
            ternary-stream vscode-gulp-watch esbuild jsonc-parser \
            gulp-merge-json gulp-tsb gulp-sourcemaps gulp-filter \
            gulp-rename gulp-sort 2>/dev/null || true

      # ========== 修复 extensions.ts - 使用完整替换 ==========
      - name: 🔧 Fix extensions.ts
        run: |
          echo "=========================================="
          echo "🔧 Fixing extensions.ts"
          echo "=========================================="

          # 直接替换整个文件，确保没有语法错误
          cat > build/lib/extensions.ts << 'EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/

          import { Stream } from 'stream';
          import * as fs from 'fs';
          import * as path from 'path';

          // 创建空流 - 用于禁用扩展打包
          function createEmptyStream(): Stream {
            const s = new Stream.Readable({ objectMode: true });
            s._read = () => s.push(null);
            return s;
          }

          // 内置扩展配置 - 使用本地扩展
          export const builtInExtensions: any[] = [];
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions: any[] = [];
          export const shouldDownloadWebBuiltInExtensions = false;

          export function isWebExtension(): boolean {
            return false;
          }

          export function getExtensionStream(): Stream {
            console.log('📦 getExtensionStream: disabled for build');
            return createEmptyStream();
          }

          export function getExtensionDownloadStream(): Stream {
            console.log('📦 getExtensionDownloadStream: disabled for build');
            return createEmptyStream();
          }

          export function packageMarketplaceExtensionsStream(): Stream {
            console.log('📦 packageMarketplaceExtensionsStream: disabled for build');
            return createEmptyStream();
          }

          export function packageNativeLocalExtensionsStream(): Stream {
            console.log('📦 packageNativeLocalExtensionsStream: disabled for build');
            return createEmptyStream();
          }

          export function packageNonNativeLocalExtensionsStream(): Stream {
            console.log('📦 packageNonNativeLocalExtensionsStream: disabled for build');
            return createEmptyStream();
          }

          export function packageLocalExtensionsStream(): Stream {
            console.log('📦 packageLocalExtensionsStream: disabled for build');
            return createEmptyStream();
          }

          export function packageExtensionsStream(): Stream {
            console.log('📦 packageExtensionsStream: disabled for build');
            return createEmptyStream();
          }

          export function packageCopilotExtensionStream(): Stream {
            console.log('📦 packageCopilotExtensionStream: disabled for build');
            return createEmptyStream();
          }

          export function packageCopilotChatExtensionStream(): Stream {
            console.log('📦 packageCopilotChatExtensionStream: disabled for build');
            return createEmptyStream();
          }

          export function packageCopilotAgentsExtensionStream(): Stream {
            console.log('📦 packageCopilotAgentsExtensionStream: disabled for build');
            return createEmptyStream();
          }

          export function fromMarketplace(): any[] {
            return [];
          }

          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log('📦 fetchUrls: disabled for build');
            return Promise.resolve();
          }

          export function buildExtensionMedia(): void {
            console.log('📦 buildExtensionMedia: skipped');
          }

          export function compileExtensionMedia(): void {
            console.log('📦 compileExtensionMedia: skipped');
          }

          export function buildExtensionMediaTask(done: any): void {
            done();
          }

          // 导出其他可能需要的函数
          export function packageAllLocalExtensionsStream(forWeb: boolean, disableMangle: boolean): Stream {
            console.log('📦 packageAllLocalExtensionsStream: disabled for build');
            return createEmptyStream();
          }

          export function scanBuiltinExtensions(extensionsRoot: string, exclude: string[] = []): any[] {
            return [];
          }

          export function translatePackageJSON(packageJSON: string, packageNLSPath: string): any {
            return {};
          }

          export function esbuildExtensions(taskName: string, isWatch: boolean, scripts: any[]): Promise<void> {
            console.log('📦 esbuildExtensions: disabled for build');
            return Promise.resolve();
          }

          export function getBuildRootsForExtension(extensionPath: string): string[] {
            return [];
          }

          export function typeCheckExtension(extensionPath: string, forWeb: boolean): Promise<void> {
            return Promise.resolve();
          }

          export function typeCheckExtensionStream(extensionPath: string, forWeb: boolean): Stream {
            return createEmptyStream();
          }

          export function fromLocal(extensionPath: string, forWeb: boolean, disableMangle: boolean): Stream {
            return createEmptyStream();
          }

          export function fromMarketplaceStream(serviceUrl: string, extension: any): Stream {
            return createEmptyStream();
          }

          export function fromGithub(extension: any): Stream {
            return createEmptyStream();
          }

          export function fromVsix(vsixPath: string, extension: any): Stream {
            return createEmptyStream();
          }

          export function minifyExtensionResources(input: Stream): Stream {
            return input;
          }

          export function updateExtensionPackageJSON(input: Stream, update: (data: any) => any): Stream {
            return input;
          }
          EOF

          echo "✅ extensions.ts completely replaced"

      - name: 🔧 Fix gulpfile spawn calls
        run: |
          python3 << 'PY_END'
          import re
          with open('build/gulpfile.vscode.ts', 'r') as f:
              content = f.read()
          content = re.sub(r"spawn\('node'", "spawn('tsx'", content)
          content = re.sub(r'spawn\("node"', 'spawn("tsx"', content)
          content = re.sub(r"spawn\(process\.execPath", "spawn('tsx'", content)
          with open('build/gulpfile.vscode.ts', 'w') as f:
              f.write(content)
          print("spawn calls fixed")
          PY_END

      - name: 🔧 Replace copilot.ts
        run: |
          cat > build/lib/copilot.ts << 'EOF'
          export async function prepareBuiltInCopilotExtensionShims(extRoot: string): Promise<void> {
              console.log('Copilot extension shims preparation skipped for UOS build');
              return;
          }
          export function copyCopilotNativeDeps(productRoot: string): void {
              console.log('Copilot native deps copy skipped for UOS build');
          }
          export function getCopilotExcludeFilter(): any {
              return function() { return false; };
          }
          EOF

      - name: 🔧 Disable Crashpad
        run: |
          echo "Disabling Crashpad"
          python3 << 'PY_JSON_END'
          import json
          import os
          if os.path.exists('product.json'):
              with open('product.json', 'r') as f:
                  data = json.load(f)
              data['enableCrashReport'] = False
              if 'crashReporter' not in data:
                  data['crashReporter'] = {}
              data['crashReporter']['disabled'] = True
              with open('product.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print("product.json modified")
          PY_JSON_END

          mkdir -p src/vs/platform/crash/common
          cat > src/vs/platform/crash/common/crashService.ts << 'CRASH_EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/
          import { createDecorator } from '../../../base/common/instantiation.js';
          export const ICrashService = createDecorator<ICrashService>('crashService');
          export interface ICrashService { _serviceBrand: undefined; }
          export class CrashService implements ICrashService {
              declare readonly _serviceBrand: undefined;
              constructor() { console.log('Crash service disabled for UOS build'); }
          }
          CRASH_EOF
          echo "crashService.ts created"

      # ========== 删除 VSCODE_SKIP_BUNDLED_EXTENSIONS ==========
      - name: ⚙️ Set env
        run: |
          echo "VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_ELECTRON_SKIP_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_PRELAUNCH=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTER=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTING=1" >> $GITHUB_ENV

      - name: 🔨 Build VSCode from source
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1
          export VSCODE_ELECTRON_SKIP_DOWNLOAD=1
          export VSCODE_SKIP_PRELAUNCH=1
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1

          echo "=========================================="
          echo "🔨 Building VSCode from source"
          echo "=========================================="
          echo "📦 Extensions: using prebuilt extensions only"
          echo "Start: $(date)"

          npx tsx node_modules/gulp/bin/gulp.js vscode-linux-x64 --no-color

          echo ""
          echo "Done: $(date)"

      # ========== 复制自定义扩展 ==========
      - name: 📦 Copy custom extensions
        run: |
          echo "=========================================="
          echo "📦 Copying custom extensions"
          echo "=========================================="

          if [ ! -d "custom-extensions" ] || [ -z "$(ls -A custom-extensions 2>/dev/null)" ]; then
            echo "ℹ️ No custom extensions to copy"
            exit 0
          fi

          BUILD_DIR=""
          for dir in "./VSCode-linux-x64" "./vscode/VSCode-linux-x64" "../VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              BUILD_DIR="$dir"
              echo "Found build directory: $BUILD_DIR"
              break
            fi
          done

          if [ -z "$BUILD_DIR" ]; then
            echo "❌ Build directory not found!"
            exit 1
          fi

          EXT_DIR="$BUILD_DIR/resources/app/extensions"
          mkdir -p "$EXT_DIR"

          echo "📌 Copying custom extensions..."
          cp -r custom-extensions/* "$EXT_DIR/"

          # 为自定义扩展安装依赖
          echo ""
          echo "📌 Installing dependencies for custom extensions..."
          cd "$EXT_DIR"
          for ext in */; do
            if [ -f "$ext/package.json" ]; then
              EXT_NAME=$(basename "$ext")
              if grep -q '"dependencies"' "$ext/package.json" 2>/dev/null; then
                echo "  📦 Installing deps for: $EXT_NAME"
                cd "$ext"
                npm install --legacy-peer-deps --ignore-scripts --production 2>/dev/null || \
                npm install --legacy-peer-deps --ignore-scripts 2>/dev/null || true
                cd -
              fi
            fi
          done
          cd -

          echo "✅ Custom extensions copied and dependencies installed"

      - name: 🔍 Verify build contents
        run: |
          echo "=========================================="
          echo "🔍 Verify build contents"
          echo "=========================================="

          BUILD_DIR=""
          for dir in "./VSCode-linux-x64" "./vscode/VSCode-linux-x64" "../VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              BUILD_DIR="$dir"
              echo "Found build directory: $BUILD_DIR"
              break
            fi
          done

          if [ -z "$BUILD_DIR" ]; then
            echo "Build directory not found!"
            exit 1
          fi

          echo ""
          echo "📌 Checking critical files..."
          for file in "resources/app/out/main.js" "resources/app/package.json" "code" "chrome-sandbox"; do
            if [ -f "$BUILD_DIR/$file" ]; then
              echo "  ✅ $file"
            else
              echo "  ❌ $file missing!"
            fi
          done

          echo ""
          echo "📌 Checking extensions..."
          if [ -d "$BUILD_DIR/resources/app/extensions" ]; then
            EXT_COUNT=$(find "$BUILD_DIR/resources/app/extensions" -maxdepth 1 -type d 2>/dev/null | wc -l)
            EXT_COUNT=$((EXT_COUNT - 1))
            echo "  ✅ Extensions directory exists with $EXT_COUNT extensions"

            echo ""
            echo "📋 Extensions list:"
            for ext in "$BUILD_DIR/resources/app/extensions"/*/; do
              if [ -f "$ext/package.json" ]; then
                EXT_NAME=$(basename "$ext")
                echo "  ✅ $EXT_NAME"
              fi
            done
          else
            echo "  ❌ Extensions directory not found!"
            exit 1
          fi

          echo ""
          echo "📌 Checking extensionHost (built-in)..."
          if [ -f "$BUILD_DIR/resources/app/out/vs/workbench/api/node/extensionHostProcess.js" ]; then
            echo "  ✅ extensionHostProcess.js"
          else
            echo "  ⚠️ extensionHostProcess.js not found"
          fi

          TARGET_DIR="./tscode"
          if [ "$BUILD_DIR" != "$TARGET_DIR" ]; then
            echo "Renaming $BUILD_DIR to $TARGET_DIR"
            rm -rf "$TARGET_DIR"
            mv "$BUILD_DIR" "$TARGET_DIR"
          fi
          BUILD_DIR="$TARGET_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

          echo ""
          echo "Build size:"
          du -sh "$BUILD_DIR"

      - name: 📦 Fix package.json and install dependencies
        run: |
          echo "=========================================="
          echo "📦 Fixing package.json and installing dependencies"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          cd "$BUILD_DIR/resources/app"

          echo "📌 Removing preinstall/postinstall scripts from package.json..."
          npx json -I -f package.json -e 'delete this.scripts.preinstall' 2>/dev/null || true
          npx json -I -f package.json -e 'delete this.scripts.postinstall' 2>/dev/null || true

          echo "📌 Removing devDependencies..."
          npx json -I -f package.json -e 'this.devDependencies={}' 2>/dev/null || true

          echo "📌 Installing production dependencies (skip scripts)..."
          npm install --legacy-peer-deps --production --ignore-scripts 2>/dev/null || \
          npm install --legacy-peer-deps --ignore-scripts

          echo "📌 Ensuring critical dependencies..."
          for dep in @vscode/ripgrep @vscode/sqlite3 @vscode/spdlog keytar node-pty vscode-oniguruma vscode-textmate native-watchdog; do
            if [ ! -d "node_modules/$dep" ]; then
              echo "  Installing $dep..."
              npm install $dep --legacy-peer-deps --ignore-scripts 2>/dev/null || true
            fi
          done

          cd -

          echo "✅ Dependencies installed"

      - name: 🧹 Cleanup
        run: |
          echo "=========================================="
          echo "🧹 Cleanup"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          echo "📊 Before cleanup:"
          du -sh "$BUILD_DIR"

          cd "$BUILD_DIR/resources/app"

          echo ""
          echo "📌 Cleaning node_modules..."
          find node_modules -name "*.ts" -type f ! -name "*.d.ts" -delete 2>/dev/null || true
          find node_modules -name "*.md" -type f -delete 2>/dev/null || true
          find node_modules -name "CHANGELOG*" -type f -delete 2>/dev/null || true
          find node_modules -name "LICENSE*" -type f -delete 2>/dev/null || true
          find node_modules -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "__tests__" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -name "*.map" -type f -delete 2>/dev/null || true
          find node_modules -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true

          echo ""
          echo "📌 Removing build temp..."
          rm -rf .cache 2>/dev/null || true
          rm -rf build 2>/dev/null || true

          cd -

          echo ""
          echo "📊 After cleanup:"
          du -sh "$BUILD_DIR"

      - name: 📄 Create launcher
        run: |
          echo "=========================================="
          echo "📄 Creating launcher"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          cd "$BUILD_DIR"

          REAL_EXEC=""
          for name in code code-oss; do
            if [ -f "./$name" ]; then
              REAL_EXEC="$name"
              break
            fi
          done

          if [ -z "$REAL_EXEC" ]; then
            REAL_EXEC=$(find . -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.sh" ! -name "chrome-*" 2>/dev/null | head -1 | sed 's|^\./||')
          fi

          if [ -z "$REAL_EXEC" ]; then
            echo "❌ No executable found!"
            exit 1
          fi

          echo "✅ Found executable: $REAL_EXEC"

          if [ "$REAL_EXEC" != "tscode" ]; then
            mv "$REAL_EXEC" "tscode"
            echo "✅ Renamed to tscode"
          fi

          cat > run.sh << 'RUNEOF'
          #!/bin/bash
          # TSCode 启动包装脚本

          export ELECTRON_ENABLE_GPU=0
          export LIBGL_ALWAYS_SOFTWARE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ELECTRON_DISABLE_SANDBOX=1
          export GDK_BACKEND=x11
          export QT_QPA_PLATFORM=xcb
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          export CRASHPAD_DISABLE=1

          /opt/tscode/tscode \
              --no-sandbox \
              --disable-gpu-sandbox \
              --disable-software-rasterizer \
              --disable-gpu \
              --disable-crash-reporter \
              "$@"
          RUNEOF

          chmod +x run.sh

          cat > start-tscode.sh << 'STARTEOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$SCRIPT_DIR/run.sh" "$@"
          STARTEOF

          chmod +x start-tscode.sh
          chmod +x tscode
          chmod +x chrome-sandbox 2>/dev/null || true

          echo "✅ Launcher created"

      - name: 📄 Create desktop entry
        run: |
          echo "=========================================="
          echo "📄 Creating desktop entry"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          mkdir -p "$BUILD_DIR/usr/share/applications"
          mkdir -p "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps"

          if [ -f "$BUILD_DIR/resources/app/resources/linux/code.png" ]; then
            cp "$BUILD_DIR/resources/app/resources/linux/code.png" \
               "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps/tscode.png"
            echo "   ✅ Icon copied"
          fi

          cat > "$BUILD_DIR/usr/share/applications/tscode.desktop" << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=TSCode
          GenericName=Code Editor
          Comment=Code Editing. Redefined.
          Exec=/opt/tscode/run.sh %F
          Icon=tscode
          Terminal=false
          Categories=Development;IDE
          MimeType=text/plain;inode/directory
          StartupNotify=true
          StartupWMClass=Code
          EOF

          echo "✅ Desktop entry created"

      - name: 📦 Build DEB package
        run: |
          echo "=========================================="
          echo "📦 Building DEB package"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"
          DEB_VERSION="${VERSION}-1"
          DEB_ARCH="amd64"
          DEB_ROOT="$(pwd)/deb_root"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/opt/tscode"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps"

          echo "📌 Copying application..."
          cp -r "$BUILD_DIR"/* "$DEB_ROOT/opt/tscode/"

          echo ""
          echo "📌 Fixing permissions..."

          if [ -f "$DEB_ROOT/opt/tscode/chrome-sandbox" ]; then
            sudo chown root:root "$DEB_ROOT/opt/tscode/chrome-sandbox"
            sudo chmod 4755 "$DEB_ROOT/opt/tscode/chrome-sandbox"
            echo "   ✅ chrome-sandbox SUID set"
          fi

          chmod +x "$DEB_ROOT/opt/tscode/tscode" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/run.sh" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/start-tscode.sh" 2>/dev/null || true
          find "$DEB_ROOT/opt/tscode" -name "rg" -type f -exec chmod 755 {} \; 2>/dev/null || true

          cd "$DEB_ROOT/usr/bin"
          ln -sf /opt/tscode/run.sh tscode
          cd -

          if [ -f "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps/tscode.png" ]; then
            cp "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps/tscode.png" \
               "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/"
          fi

          cp "$BUILD_DIR/usr/share/applications/tscode.desktop" \
             "$DEB_ROOT/usr/share/applications/"

          cat > "$DEB_ROOT/DEBIAN/control" << 'CONTROLEOF'
          Package: tscode
          Version: REPLACE_VERSION
          Architecture: REPLACE_ARCH
          Maintainer: TSCode Team <tscode@example.com>
          Description: TSCode - Code Editing. Redefined.
           TSCode is a code editor redefined and optimized for building
           and debugging modern web and cloud applications.
          Depends: libgtk-3-0, libx11-6, libxss1, libxtst6, libnss3, libasound2, libgbm1, libglib2.0-0, libcairo2, libpango-1.0-0, libatk1.0-0, libgdk-pixbuf2.0-0
          Recommends: git, python3
          Section: devel
          Priority: optional
          CONTROLEOF

          sed -i "s/REPLACE_VERSION/$DEB_VERSION/g" "$DEB_ROOT/DEBIAN/control"
          sed -i "s/REPLACE_ARCH/$DEB_ARCH/g" "$DEB_ROOT/DEBIAN/control"

          cat > "$DEB_ROOT/DEBIAN/postinst" << 'POSTINSTEOF'
          #!/bin/bash
          set -e

          if [ -f "/opt/tscode/chrome-sandbox" ]; then
              chown root:root /opt/tscode/chrome-sandbox
              chmod 4755 /opt/tscode/chrome-sandbox
          fi

          chmod +x /opt/tscode/run.sh /opt/tscode/tscode 2>/dev/null || true

          if [ -f "/opt/tscode/resources/app/node_modules/@vscode/ripgrep/bin/rg" ]; then
              chmod 755 /opt/tscode/resources/app/node_modules/@vscode/ripgrep/bin/rg
          fi

          update-desktop-database /usr/share/applications/ 2>/dev/null || true

          echo ""
          echo "✅ TSCode installed successfully!"
          echo "Run 'tscode' to start (no password required)."
          echo "=========================================="
          POSTINSTEOF

          chmod +x "$DEB_ROOT/DEBIAN/postinst"

          echo ""
          echo "📌 Building DEB package..."
          fakeroot dpkg-deb -Zgzip -z9 --build "$DEB_ROOT" "tscode-${DEB_VERSION}_${DEB_ARCH}.deb"

          if [ $? -eq 0 ] && [ -f "tscode-${DEB_VERSION}_${DEB_ARCH}.deb" ]; then
            echo ""
            echo "✅ DEB package built successfully!"
            ls -lh "tscode-${DEB_VERSION}_${DEB_ARCH}.deb"
            sha256sum "tscode-${DEB_VERSION}_${DEB_ARCH}.deb" > "tscode-${DEB_VERSION}_${DEB_ARCH}.deb.sha256"
          else
            echo "❌ Failed to build DEB package"
            exit 1
          fi

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tscode-debian10-deb
          path: |
            *.deb
            *.deb.sha256
          retention-days: 30

      - name: 📊 Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "📊 BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ github.event.inputs.version || '1.116.0' }}"
          echo "Format: DEB (Debian 10)"
          echo "Build: Pure source (built-in extensionHost)"
          echo ""
          echo "✅ Features:"
          echo "   - No password required on startup"
          echo "   - Desktop entry in application menu"
          echo "   - Built from source"
          echo "   - extensionHost is built-in"
          echo "   - ✅ Custom extensions included"
          echo "   - ✅ Offline installation supported"
          echo "=========================================="

          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully!"
            echo ""
            echo "📦 DEB Package:"
            ls -lh *.deb 2>/dev/null
            echo ""
            echo "📖 Installation (offline supported):"
            echo "  sudo dpkg -i tscode-*.deb"
            echo "  sudo apt-get install -f"
            echo ""
            echo "🚀 Run: tscode"
            echo "=========================================="
          fi