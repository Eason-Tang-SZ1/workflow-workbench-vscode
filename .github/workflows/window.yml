name: Build Custom VSCode for Windows

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
      version:
        description: 'Package version'
        required: false
        default: '1.116.0'

jobs:
  build-windows:
    name: Build Windows Version
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: 🔧 Install Visual Studio Build Tools
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "🔧 Installing Visual Studio Build Tools"
          Write-Host "=========================================="

          # Install Visual Studio Build Tools
          choco install visualstudio2022buildtools -y --no-progress
          choco install visualstudio2022-workload-vctools -y --no-progress

          Write-Host "✅ Visual Studio Build Tools installed"

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: 🔧 Fix TypeScript scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/npm | Out-Null
          "console.log('Preinstall OK');" | Out-File -FilePath build/npm/preinstall.js -Encoding utf8
          (Get-Content package.json) -replace '"preinstall": "node build/npm/preinstall.ts"', '"preinstall": "node build/npm/preinstall.js"' | Set-Content package.json
          "console.log('Postinstall OK');" | Out-File -FilePath build/npm/postinstall.js -Encoding utf8
          (Get-Content package.json) -replace '"postinstall": "node build/npm/postinstall.ts"', '"postinstall": "node build/npm/postinstall.js"' | Set-Content package.json
          Write-Host "✅ TypeScript scripts fixed"

      - name: 📦 Install dependencies (skip native modules)
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "📦 Installing dependencies (skip native modules)"
          Write-Host "=========================================="

          # Install dependencies, skip native module compilation
          npm install --legacy-peer-deps --ignore-scripts

          Write-Host "✅ Dependencies installed"

      - name: 📦 Install build tools
        shell: pwsh
        run: |
          npm install -g tsx
          npm install --legacy-peer-deps --ignore-scripts `
            ternary-stream vscode-gulp-watch esbuild jsonc-parser `
            gulp-merge-json gulp-tsb gulp-sourcemaps gulp-filter `
            gulp-rename gulp-sort 2>$null
          Write-Host "✅ Build tools installed"

      - name: 🔧 Fix extensions.ts
        shell: pwsh
        run: |
          $content = @'
          import { Stream } from "stream";
          const empty: any[] = [];
          function emptyStream(): Stream {
            const s = new Stream.Readable();
            s._read = () => s.push(null);
            return s;
          }
          export function isWebExtension(): boolean { return false; }
          export function getExtensionStream(): Stream { return emptyStream(); }
          export function getExtensionDownloadStream(): Stream { return emptyStream(); }
          export function packageMarketplaceExtensionsStream(): Stream { return emptyStream(); }
          export function packageNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageNonNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageExtensionsStream(): Stream { return emptyStream(); }
          export function packageCopilotExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotChatExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotAgentsExtensionStream(): Stream { return emptyStream(); }
          export function fromMarketplace(): any[] { return empty; }
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }
          export function buildExtensionMedia(): void {}
          export function compileExtensionMedia(): void {}
          export function buildExtensionMediaTask(done: any): void { done(); }
          export const builtInExtensions = empty;
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions = empty;
          export const shouldDownloadWebBuiltInExtensions = false;
          '@
          $content | Out-File -FilePath build/lib/extensions.ts -Encoding utf8

          $builtin = @'
          export const builtInExtensions: any[] = [];
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions: any[] = [];
          export const shouldDownloadWebBuiltInExtensions = false;
          '@
          $builtin | Out-File -FilePath build/lib/builtInExtensions.ts -Encoding utf8

          $fetch = @'
          import { Stream } from "stream";
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }
          '@
          $fetch | Out-File -FilePath build/lib/fetch.ts -Encoding utf8

          Write-Host "✅ extensions.ts fixed"

      - name: 🔧 Fix gulpfile spawn calls
        shell: pwsh
        run: |
          $content = Get-Content build/gulpfile.vscode.ts -Raw
          $content = $content -replace "spawn\('node'", "spawn('tsx'"
          $content = $content -replace 'spawn\("node"', 'spawn("tsx"'
          $content = $content -replace "spawn\(process\.execPath", "spawn('tsx'"
          $content | Out-File -FilePath build/gulpfile.vscode.ts -Encoding utf8
          Write-Host "✅ gulpfile spawn calls fixed"

      - name: 🔧 Replace copilot.ts
        shell: pwsh
        run: |
          $content = @'
          export async function prepareBuiltInCopilotExtensionShims(extRoot: string): Promise<void> {
              console.log('Copilot extension shims preparation skipped for Windows build');
              return;
          }
          export function copyCopilotNativeDeps(productRoot: string): void {
              console.log('Copilot native deps copy skipped for Windows build');
          }
          export function getCopilotExcludeFilter(): any {
              return function() { return false; };
          }
          '@
          $content | Out-File -FilePath build/lib/copilot.ts -Encoding utf8
          Write-Host "✅ copilot.ts replaced"

      - name: 🔧 Disable Crashpad
        shell: pwsh
        run: |
          Write-Host "Disabling Crashpad"
          $productPath = "product.json"
          if (Test-Path $productPath) {
            $json = Get-Content $productPath | ConvertFrom-Json
            $json | Add-Member -MemberType NoteProperty -Name "enableCrashReport" -Value $false -Force
            if ($null -eq $json.crashReporter) {
              $json | Add-Member -MemberType NoteProperty -Name "crashReporter" -Value @{} -Force
            }
            $json.crashReporter | Add-Member -MemberType NoteProperty -Name "disabled" -Value $true -Force
            $json | ConvertTo-Json -Depth 10 | Set-Content $productPath
            Write-Host "product.json modified"
          }

          New-Item -ItemType Directory -Force -Path src/vs/platform/crash/common | Out-Null
          $crashService = @'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/
          import { createDecorator } from '../../../base/common/instantiation.js';
          export const ICrashService = createDecorator<ICrashService>('crashService');
          export interface ICrashService { _serviceBrand: undefined; }
          export class CrashService implements ICrashService {
              declare readonly _serviceBrand: undefined;
              constructor() { console.log('Crash service disabled for Windows build'); }
          }
          '@
          $crashService | Out-File -FilePath src/vs/platform/crash/common/crashService.ts -Encoding utf8
          Write-Host "✅ Crashpad disabled"

      - name: ⚙️ Set env
        shell: pwsh
        run: |
          echo "VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VSCODE_ELECTRON_SKIP_DOWNLOAD=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VSCODE_SKIP_PRELAUNCH=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VSCODE_SKIP_BUNDLED_EXTENSIONS=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ELECTRON_DISABLE_CRASH_REPORTER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ELECTRON_DISABLE_CRASH_REPORTING=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "npm_config_ignore_scripts=true" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 🔨 Build VSCode
        shell: pwsh
        run: |
          $env:NODE_OPTIONS="--max-old-space-size=8192"
          $env:VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD="1"
          $env:VSCODE_ELECTRON_SKIP_DOWNLOAD="1"
          $env:VSCODE_SKIP_PRELAUNCH="1"
          $env:VSCODE_SKIP_BUNDLED_EXTENSIONS="1"
          $env:ELECTRON_DISABLE_CRASH_REPORTER="1"
          $env:ELECTRON_DISABLE_CRASH_REPORTING="1"

          Write-Host "Start: $(Get-Date)"

          # Remove problematic native modules to avoid compilation issues
          $modulesToRemove = @(
            "node_modules\@vscode\native-watchdog",
            "node_modules\@vscode\policy-watcher",
            "node_modules\@vscode\deviceid",
            "node_modules\@vscode\spdlog",
            "node_modules\@vscode\sqlite3"
          )

          foreach ($mod in $modulesToRemove) {
            if (Test-Path $mod) {
              Write-Host "Removing $mod..."
              Remove-Item -Recurse -Force $mod -ErrorAction SilentlyContinue
            }
          }

          npx tsx node_modules/gulp/bin/gulp.js vscode-win32-x64 --no-color
          Write-Host "Done: $(Get-Date)"

      - name: 🔍 Verify and locate build
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "🔍 Verify build contents"
          Write-Host "=========================================="

          Write-Host "Current directory contents:"
          Get-ChildItem -Directory | ForEach-Object { Write-Host "  $($_.Name)" }

          Write-Host ""
          Write-Host "Searching for VSCode build directories..."
          $BUILD_DIR = $null

          $possible_dirs = @(
            ".\VSCode-win32-x64",
            ".\vscode\VSCode-win32-x64",
            "..\VSCode-win32-x64",
            ".\VSCode",
            ".\vscode\VSCode",
            ".\out\VSCode-win32-x64"
          )

          foreach ($dir in $possible_dirs) {
            if (Test-Path $dir) {
              $BUILD_DIR = (Resolve-Path $dir).Path
              Write-Host "Found build directory: $BUILD_DIR"
              break
            }
          }

          if (-not $BUILD_DIR) {
            Write-Host "Searching recursively for VSCode-win32-x64..."
            $found = Get-ChildItem -Recurse -Directory -Filter "VSCode-win32-x64" | Select-Object -First 1
            if ($found) {
              $BUILD_DIR = $found.FullName
              Write-Host "Found build directory via recursive search: $BUILD_DIR"
            }
          }

          if (-not $BUILD_DIR) {
            Write-Host "❌ Build directory not found!"
            Write-Host "Listing all directories recursively (top 30):"
            Get-ChildItem -Recurse -Directory | Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

          echo "BUILD_DIR=$BUILD_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host ""
          Write-Host "Build directory structure:"
          Get-ChildItem -Path $BUILD_DIR | ForEach-Object { Write-Host "  $($_.Name)" }

          if (Test-Path "$BUILD_DIR\resources\app") {
            Write-Host "✅ resources\app exists"
          } else {
            Write-Host "⚠️ resources\app does not exist"
          }

      - name: 📂 Prepare extensions directory
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "📂 Prepare extensions directory"
          Write-Host "=========================================="

          $BUILD_DIR = $env:BUILD_DIR
          if (-not $BUILD_DIR) {
            Write-Host "❌ BUILD_DIR not set!"
            exit 1
          }

          $EXT_DIR = "$BUILD_DIR\resources\app\extensions"
          New-Item -ItemType Directory -Force -Path $EXT_DIR | Out-Null
          Write-Host "✅ Created extensions directory: $EXT_DIR"

          $NODE_MODULES = "$BUILD_DIR\resources\app\node_modules"
          New-Item -ItemType Directory -Force -Path $NODE_MODULES | Out-Null
          Write-Host "✅ Created node_modules directory: $NODE_MODULES"

      - name: 📂 Copy and build extensions
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "📂 Copy and build extensions"
          Write-Host "=========================================="

          $BUILD_DIR = $env:BUILD_DIR
          if (-not $BUILD_DIR) {
            Write-Host "❌ BUILD_DIR not set!"
            exit 1
          }

          $EXT_DIR = "$BUILD_DIR\resources\app\extensions"

          # Copy from source extensions
          if (Test-Path ".\extensions") {
            Write-Host "📌 Copying extensions from source..."
            Get-ChildItem -Path ".\extensions" -Directory | ForEach-Object {
              $dir_name = $_.Name
              Write-Host "   Processing $dir_name..."
              Copy-Item -Recurse -Force $_.FullName "$EXT_DIR\$dir_name"

              $EXT_PATH = "$EXT_DIR\$dir_name"
              if (Test-Path "$EXT_PATH\package.json") {
                Write-Host "      Building $dir_name..."
                Push-Location $EXT_PATH
                npm install --production --no-audit --no-fund --ignore-scripts 2>$null
                if (Test-Path "src") {
                  npx tsc -p . 2>$null
                }
                Pop-Location
              }
            }
            Write-Host "   ✅ extensions copied"
          }

          # Install prebuilt extensions
          if (Test-Path ".\prebuilt-extensions") {
            Write-Host ""
            Write-Host "📌 Installing prebuilt extensions..."
            Get-ChildItem -Path ".\prebuilt-extensions" -Filter "*.vsix" | ForEach-Object {
              $vsix = $_.FullName
              $ext_name = $_.BaseName
              Write-Host "   Installing $ext_name..."
              $EXT_PATH = "$EXT_DIR\$ext_name"
              if (Test-Path $EXT_PATH) { Remove-Item -Recurse -Force $EXT_PATH }
              New-Item -ItemType Directory -Force -Path $EXT_PATH | Out-Null

              Push-Location $EXT_PATH
              try {
                npx --yes vsce-unpack $vsix 2>$null
              } catch {
                Write-Host "      vsce-unpack failed, trying 7z..."
                if (Get-Command 7z -ErrorAction SilentlyContinue) {
                  7z x $vsix -o"$EXT_PATH" -y
                }
              }
              Pop-Location

              if (Test-Path "$EXT_PATH\extension") {
                Get-ChildItem -Path "$EXT_PATH\extension" | Move-Item -Destination $EXT_PATH -Force
                Remove-Item -Recurse -Force "$EXT_PATH\extension"
              }

              if (Test-Path "$EXT_PATH\package.json") {
                Write-Host "      Installing dependencies for $ext_name..."
                Push-Location $EXT_PATH
                npm install --production --no-audit --no-fund --ignore-scripts 2>$null
                Pop-Location
              }
              Write-Host "   ✅ Installed $ext_name"
            }
            Write-Host "   ✅ prebuilt extensions installed"
          }

          # Download official Git extensions
          Write-Host ""
          Write-Host "📌 Downloading official VSCode for compiled Git extensions..."
          try {
            $officialZip = "$env:TEMP\official.zip"
            Invoke-WebRequest -Uri "https://update.code.visualstudio.com/latest/win32-x64/stable" -OutFile $officialZip -ErrorAction Stop
            Expand-Archive -Path $officialZip -DestinationPath "$env:TEMP\official" -Force
            $OFFICIAL_DIR = Get-ChildItem -Path "$env:TEMP\official" -Recurse -Directory | Where-Object { $_.Name -eq "VSCode-win32-x64" } | Select-Object -First 1

            if ($OFFICIAL_DIR -and (Test-Path "$OFFICIAL_DIR\resources\app\extensions")) {
              Write-Host "   ✅ Found official extensions directory"
              $GIT_EXTS = @("git", "git-base", "github", "github-authentication", "tunnel-forwarding")

              foreach ($ext in $GIT_EXTS) {
                $OFFICIAL_EXT = "$OFFICIAL_DIR\resources\app\extensions\$ext"
                $TARGET_EXT = "$EXT_DIR\$ext"

                if (Test-Path $OFFICIAL_EXT) {
                  Write-Host ""
                  Write-Host "   Processing $ext..."
                  if (Test-Path $TARGET_EXT) { Remove-Item -Recurse -Force $TARGET_EXT }
                  Copy-Item -Recurse -Force $OFFICIAL_EXT $TARGET_EXT

                  if (Test-Path "$TARGET_EXT\dist") {
                    Write-Host "      ✅ $ext has dist/ (compiled)"
                  } else {
                    Write-Host "      🔨 Compiling $ext..."
                    if (Test-Path "$TARGET_EXT\package.json") {
                      Push-Location $TARGET_EXT
                      npm install --no-audit --no-fund --ignore-scripts 2>$null
                      npm run compile 2>$null
                      Pop-Location
                    }
                  }
                }
              }
            } else {
              Write-Host "   ⚠️ Could not find official extensions"
            }
          } catch {
            Write-Host "   ⚠️ Failed to download official VSCode: $_"
          }

          # Create extension index
          Write-Host ""
          Write-Host "📌 Creating extension index file..."

          $pkgContent = @'
          {
            "name": "builtin-extensions",
            "version": "1.0.0",
            "description": "Built-in extensions",
            "private": true,
            "extensionPack": []
          }
          '@
          $pkgContent | Out-File -FilePath "$EXT_DIR\package.json" -Encoding utf8

          $extensions = @()
          Get-ChildItem -Path $EXT_DIR -Directory | ForEach-Object {
            $extPath = $_.FullName
            $packageJson = "$extPath\package.json"
            if (Test-Path $packageJson) {
              $ext_name = $_.Name
              if ($ext_name -notin @("node_modules", "package.json", "extensions.json")) {
                try {
                  $pkg = Get-Content $packageJson | ConvertFrom-Json
                  if ($pkg.publisher -and $pkg.name) {
                    $extensions += "$($pkg.publisher).$($pkg.name)"
                    Write-Host "   📌 $($pkg.publisher).$($pkg.name)@$($pkg.version)"
                  }
                } catch {
                  Write-Host "   ⚠️ Could not parse $packageJson"
                }
              }
            }
          }

          $extJson = @{ extensions = $extensions }
          $extJson | ConvertTo-Json -Depth 10 | Out-File -FilePath "$EXT_DIR\extensions.json" -Encoding utf8
          Write-Host "   ✅ Extension index created"

          # Update product.json
          Write-Host ""
          Write-Host "📌 Updating product.json to enable extensions..."
          $PRODUCT_PATH = "$BUILD_DIR\resources\app\product.json"
          if (Test-Path $PRODUCT_PATH) {
            $product = Get-Content $PRODUCT_PATH | ConvertFrom-Json
            $product | Add-Member -MemberType NoteProperty -Name "extensionsGallery" -Value @{
              serviceUrl = "https://marketplace.visualstudio.com/_apis/public/gallery"
              cacheUrl = "https://vscode.blob.core.windows.net/gallery/index"
              itemUrl = "https://marketplace.visualstudio.com/items"
            } -Force
            $product | Add-Member -MemberType NoteProperty -Name "builtInExtensions" -Value @() -Force
            $product | ConvertTo-Json -Depth 10 | Set-Content $PRODUCT_PATH
            Write-Host "   ✅ product.json updated"
          } else {
            Write-Host "   ⚠️ product.json not found at $PRODUCT_PATH"
          }

          # Cleanup
          if (Test-Path "$env:TEMP\official") { Remove-Item -Recurse -Force "$env:TEMP\official" -ErrorAction SilentlyContinue }
          if (Test-Path "$env:TEMP\official.zip") { Remove-Item -Force "$env:TEMP\official.zip" -ErrorAction SilentlyContinue }

          Write-Host ""
          Write-Host "✅ Extensions preparation complete"

      - name: 📄 Copy config files to root
        shell: pwsh
        run: |
          $BUILD_DIR = $env:BUILD_DIR
          if (-not $BUILD_DIR) {
            $BUILD_DIR = ".\VSCode-win32-x64"
          }
          Push-Location $BUILD_DIR
          if (Test-Path "resources\app\package.json") {
            Copy-Item "resources\app\package.json" . -Force
            Write-Host "✅ package.json copied to root"
          }
          if (Test-Path "resources\app\product.json") {
            Copy-Item "resources\app\product.json" . -Force
            Write-Host "✅ product.json copied to root"
          }
          Pop-Location

      - name: 🚀 Create startup scripts
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "🚀 Create startup scripts"
          Write-Host "=========================================="

          $BUILD_DIR = $env:BUILD_DIR
          if (-not $BUILD_DIR) {
            Write-Host "❌ BUILD_DIR not set!"
            exit 1
          }
          Push-Location $BUILD_DIR

          # Find the real executable
          $REAL_EXEC = $null
          $possible_names = @(
            "Code.exe",
            "code.exe",
            "bin\code.exe",
            "bin\Code.exe"
          )
          foreach ($name in $possible_names) {
            if (Test-Path $name) {
              $REAL_EXEC = $name
              break
            }
          }

          if (-not $REAL_EXEC) {
            $exeFiles = Get-ChildItem -Filter "*.exe" -File | Where-Object {
              $_.Name -notmatch "chrome|crash|debug|libGL|vulkan|d3d|nw"
            }
            if ($exeFiles) {
              $REAL_EXEC = $exeFiles[0].Name
            }
          }

          if (-not $REAL_EXEC) {
            Write-Host "❌ No executable found!"
            Write-Host "Files in build directory:"
            Get-ChildItem | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          Write-Host "Found executable: $REAL_EXEC"

          # Rename the real executable
          Move-Item -Path $REAL_EXEC -NewName "tscode.real.exe" -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "tscode.real.exe")) {
            Copy-Item -Path $REAL_EXEC -Destination "tscode.real.exe" -Force
          }
          Write-Host "✅ Created tscode.real.exe"

          # Create batch wrapper
          $batchContent = @'
          @echo off
          set SCRIPT_DIR=%~dp0
          set ELECTRON_ENABLE_GPU=0
          set NODE_OPTIONS=--max-old-space-size=4096
          set ELECTRON_DISABLE_SANDBOX=1
          set ELECTRON_DISABLE_CRASH_REPORTER=1
          set ELECTRON_DISABLE_CRASH_REPORTING=1
          set CRASHPAD_DISABLE=1
          set USER_DATA_DIR=%SCRIPT_DIR%user-data
          if not exist "%USER_DATA_DIR%" mkdir "%USER_DATA_DIR%"
          echo Starting VSCode for Windows...
          "%SCRIPT_DIR%tscode.real.exe" ^
              --no-sandbox ^
              --disable-gpu-sandbox ^
              --disable-software-rasterizer ^
              --disable-gpu ^
              --user-data-dir="%USER_DATA_DIR%" ^
              --enable-extensions ^
              --builtin-extensions-dir="%SCRIPT_DIR%resources\app\extensions" ^
              %*
          '@
          $batchContent | Out-File -FilePath "tscode.bat" -Encoding ascii
          Write-Host "✅ Created tscode.bat"

          # Create PowerShell wrapper
          $psContent = @'
          $ScriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path
          $env:ELECTRON_ENABLE_GPU = "0"
          $env:NODE_OPTIONS = "--max-old-space-size=4096"
          $env:ELECTRON_DISABLE_SANDBOX = "1"
          $env:ELECTRON_DISABLE_CRASH_REPORTER = "1"
          $env:ELECTRON_DISABLE_CRASH_REPORTING = "1"
          $env:CRASHPAD_DISABLE = "1"
          $UserDataDir = Join-Path $ScriptDir "user-data"
          if (-not (Test-Path $UserDataDir)) { New-Item -ItemType Directory -Path $UserDataDir -Force | Out-Null }
          $Executable = Join-Path $ScriptDir "tscode.real.exe"
          if (-not (Test-Path $Executable)) {
              Write-Host "VSCode executable not found!" -ForegroundColor Red
              Write-Host "Looking for exe files in $ScriptDir..."
              Get-ChildItem -Path $ScriptDir -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.Name)" }
              exit 1
          }
          Write-Host "Starting VSCode for Windows..." -ForegroundColor Green
          & $Executable `
              --no-sandbox `
              --disable-gpu-sandbox `
              --disable-software-rasterizer `
              --disable-gpu `
              --user-data-dir="$UserDataDir" `
              --enable-extensions `
              --builtin-extensions-dir="$ScriptDir\resources\app\extensions" `
              $args
          '@
          $psContent | Out-File -FilePath "tscode.ps1" -Encoding utf8
          Write-Host "✅ Created tscode.ps1"

          # Create desktop shortcut script
          $shortcutContent = @'
          $WshShell = New-Object -comObject WScript.Shell
          $PSScriptRoot = Split-Path -Parent $MyInvocation.MyCommand.Path
          $Shortcut = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\VSCode for Windows.lnk")
          $Shortcut.TargetPath = "$PSScriptRoot\tscode.bat"
          $Shortcut.WorkingDirectory = "$PSScriptRoot"
          $IconPath = "$PSScriptRoot\resources\app\resources\win32\code.ico"
          if (Test-Path $IconPath) {
              $Shortcut.IconLocation = $IconPath
          }
          $Shortcut.Save()
          Write-Host "Desktop shortcut created!" -ForegroundColor Green
          Write-Host "Shortcut: $env:USERPROFILE\Desktop\VSCode for Windows.lnk" -ForegroundColor Green
          '@
          $shortcutContent | Out-File -FilePath "create-shortcut.ps1" -Encoding utf8
          Write-Host "✅ Created create-shortcut.ps1"

          Write-Host ""
          Write-Host "📋 Startup scripts created:"
          Write-Host "   tscode.bat           - Batch launcher (double-click to run)"
          Write-Host "   tscode.ps1           - PowerShell launcher"
          Write-Host "   create-shortcut.ps1  - Create desktop shortcut"

          Pop-Location

      - name: 📦 Package
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "📦 Package"
          Write-Host "=========================================="

          $BUILD_DIR = $env:BUILD_DIR
          if (-not $BUILD_DIR) {
            Write-Host "❌ BUILD_DIR not set!"
            exit 1
          }

          $VERSION = "${{ github.event.inputs.version || '1.116.0' }}"

          $zipName = "vscode-windows-${VERSION}.zip"
          Write-Host "Creating $zipName ..."

          $parentDir = Split-Path $BUILD_DIR -Parent
          $buildFolderName = Split-Path $BUILD_DIR -Leaf

          Push-Location $parentDir
          Compress-Archive -Path "$buildFolderName\*" -DestinationPath "$zipName" -Force
          Pop-Location

          Write-Host ""
          Write-Host "✅ Package created:"
          $fileInfo = Get-ChildItem -Path $zipName
          Write-Host "  Name: $($fileInfo.Name)"
          Write-Host "  Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"

          echo "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vscode-windows-x64
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: 📊 Build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "BUILD SUMMARY"
          Write-Host "=========================================="
          Write-Host "Status: ${{ job.status }}"
          Write-Host "Version: ${{ github.event.inputs.version || '1.116.0' }}"
          Write-Host "Platform: Windows x64"
          Write-Host "=========================================="
          if ("${{ job.status }}" -eq "success") {
            Write-Host ""
            Write-Host "✅ Build completed successfully!"
            Write-Host ""
            Write-Host "📦 Package: $env:ZIP_NAME"
            Write-Host ""
            Write-Host "📋 To use on Windows:"
            Write-Host "  1. Extract the zip file"
            Write-Host "  2. Run tscode.bat or tscode.ps1"
            Write-Host "  3. Optional: run create-shortcut.ps1 to create desktop shortcut"
          } else {
            Write-Host ""
            Write-Host "❌ Build failed. Check the logs above for errors."
          }
          Write-Host "=========================================="