name: Build Custom VSCode for UOS (Double-click)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
      version:
        description: 'Package version'
        required: false
        default: '1.116.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-3-dev libxkbfile-dev \
            libkrb5-dev libgbm-dev rpm libx11-dev libxss-dev libxtst-dev \
            libnss3-dev libasound2-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev \
            python3 git wget curl

      - name: 🔧 Fix TypeScript scripts
        run: |
          echo 'console.log("Preinstall OK");' > build/npm/preinstall.js
          sed -i 's/"preinstall": "node build\/npm\/preinstall.ts"/"preinstall": "node build\/npm\/preinstall.js"/' package.json
          echo 'console.log("Postinstall OK");' > build/npm/postinstall.js
          sed -i 's/"postinstall": "node build\/npm\/postinstall.ts"/"postinstall": "node build\/npm\/postinstall.js"/' package.json

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 📦 Install build tools
        run: |
          npm install -g tsx
          npm install --legacy-peer-deps \
            ternary-stream vscode-gulp-watch esbuild jsonc-parser \
            gulp-merge-json gulp-tsb gulp-sourcemaps gulp-filter \
            gulp-rename gulp-sort 2>/dev/null || true

      - name: 🔧 Fix extensions.ts
        run: |
          cat > build/lib/extensions.ts << 'EOF'
          import { Stream } from "stream";
          const empty: any[] = [];
          function emptyStream(): Stream {
            const s = new Stream.Readable();
            s._read = () => s.push(null);
            return s;
          }
          export function isWebExtension(): boolean { return false; }
          export function getExtensionStream(): Stream { return emptyStream(); }
          export function getExtensionDownloadStream(): Stream { return emptyStream(); }
          export function packageMarketplaceExtensionsStream(): Stream { return emptyStream(); }
          export function packageNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageNonNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageExtensionsStream(): Stream { return emptyStream(); }
          export function packageCopilotExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotChatExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotAgentsExtensionStream(): Stream { return emptyStream(); }
          export function fromMarketplace(): any[] { return empty; }
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }
          export function buildExtensionMedia(): void {}
          export function compileExtensionMedia(): void {}
          export function buildExtensionMediaTask(done: any): void { done(); }
          export const builtInExtensions = empty;
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions = empty;
          export const shouldDownloadWebBuiltInExtensions = false;
          EOF
          echo 'export const builtInExtensions: any[] = [];
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions: any[] = [];
          export const shouldDownloadWebBuiltInExtensions = false;' > build/lib/builtInExtensions.ts
          echo 'import { Stream } from "stream";
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }' > build/lib/fetch.ts

      - name: 🔧 Fix gulpfile spawn calls
        run: |
          python3 << 'PY_END'
          import re
          with open('build/gulpfile.vscode.ts', 'r') as f:
              content = f.read()
          content = re.sub(r"spawn\('node'", "spawn('tsx'", content)
          content = re.sub(r'spawn\("node"', 'spawn("tsx"', content)
          content = re.sub(r"spawn\(process\.execPath", "spawn('tsx'", content)
          with open('build/gulpfile.vscode.ts', 'w') as f:
              f.write(content)
          print("spawn calls fixed")
          PY_END

      - name: 🔧 Replace copilot.ts
        run: |
          cat > build/lib/copilot.ts << 'EOF'
          export async function prepareBuiltInCopilotExtensionShims(extRoot: string): Promise<void> {
              console.log('Copilot extension shims preparation skipped for UOS build');
              return;
          }
          export function copyCopilotNativeDeps(productRoot: string): void {
              console.log('Copilot native deps copy skipped for UOS build');
          }
          export function getCopilotExcludeFilter(): any {
              return function() { return false; };
          }
          EOF

      - name: 🔧 Disable Crashpad
        run: |
          echo "Disabling Crashpad"
          python3 << 'PY_JSON_END'
          import json
          import os
          if os.path.exists('product.json'):
              with open('product.json', 'r') as f:
                  data = json.load(f)
              data['enableCrashReport'] = False
              if 'crashReporter' not in data:
                  data['crashReporter'] = {}
              data['crashReporter']['disabled'] = True
              with open('product.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print("product.json modified")
          PY_JSON_END

          mkdir -p src/vs/platform/crash/common
          cat > src/vs/platform/crash/common/crashService.ts << 'CRASH_EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/
          import { createDecorator } from '../../../base/common/instantiation.js';
          export const ICrashService = createDecorator<ICrashService>('crashService');
          export interface ICrashService { _serviceBrand: undefined; }
          export class CrashService implements ICrashService {
              declare readonly _serviceBrand: undefined;
              constructor() { console.log('Crash service disabled for UOS build'); }
          }
          CRASH_EOF
          echo "crashService.ts created"

      - name: ⚙️ Set env
        run: |
          echo "VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_ELECTRON_SKIP_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_PRELAUNCH=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTER=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTING=1" >> $GITHUB_ENV

      - name: 🔨 Build VSCode (包含您的二开代码)
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1
          export VSCODE_ELECTRON_SKIP_DOWNLOAD=1
          export VSCODE_SKIP_PRELAUNCH=1
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          echo "Start: $(date)"
          npx tsx node_modules/gulp/bin/gulp.js vscode-linux-x64 --no-color
          echo "Done: $(date)"

      - name: 🔍 Verify build contents
        run: |
          echo "=========================================="
          echo "🔍 Verify build contents"
          echo "=========================================="

          BUILD_DIR=""
          for dir in "./VSCode-linux-x64" "./vscode/VSCode-linux-x64" "../VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              BUILD_DIR="$dir"
              echo "Found build directory: $BUILD_DIR"
              break
            fi
          done

          if [ -z "$BUILD_DIR" ]; then
            echo "Build directory not found!"
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

      # ============================================================
      # 12. 备份自定义二进制（包含二开代码）
      # ============================================================
      - name: 📥 Backup custom binary
        run: |
          echo "=========================================="
          echo "📥 Backup custom binary"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"
          mkdir -p /tmp/backup-custom

          echo ""
          echo "1. Backup custom binary..."
          if [ -f "$BUILD_DIR/tscode.real" ]; then
            cp "$BUILD_DIR/tscode.real" /tmp/backup-custom/
            echo "   [OK] tscode.real (custom build with 二开)"
          elif [ -f "$BUILD_DIR/code" ]; then
            cp "$BUILD_DIR/code" /tmp/backup-custom/tscode.real
            echo "   [OK] code -> tscode.real (custom build with 二开)"
          else
            echo "   [FAIL] No executable found!"
            exit 1
          fi

          echo ""
          echo "2. Backup custom extensions..."
          if [ -d "$BUILD_DIR/resources/app/extensions" ]; then
            cp -r "$BUILD_DIR/resources/app/extensions" /tmp/backup-custom/
            echo "   [OK] extensions"
          fi

          echo ""
          echo "3. Backup custom config files..."
          [ -f "$BUILD_DIR/package.json" ] && cp "$BUILD_DIR/package.json" /tmp/backup-custom/ && echo "   [OK] package.json"
          [ -f "$BUILD_DIR/product.json" ] && cp "$BUILD_DIR/product.json" /tmp/backup-custom/ && echo "   [OK] product.json"

          echo ""
          echo "4. Backup custom snapshot (匹配二开版本)..."
          [ -f "$BUILD_DIR/snapshot_blob.bin" ] && cp "$BUILD_DIR/snapshot_blob.bin" /tmp/backup-custom/ && echo "   [OK] snapshot_blob.bin"
          [ -f "$BUILD_DIR/v8_context_snapshot.bin" ] && cp "$BUILD_DIR/v8_context_snapshot.bin" /tmp/backup-custom/ && echo "   [OK] v8_context_snapshot.bin"

          echo ""
          echo "5. Backup chrome-sandbox..."
          [ -f "$BUILD_DIR/chrome-sandbox" ] && cp "$BUILD_DIR/chrome-sandbox" /tmp/backup-custom/ && echo "   [OK] chrome-sandbox"

          echo ""
          echo "Backup contents:"
          ls -la /tmp/backup-custom/

      # ============================================================
      # 13. 下载官方 VSCode（只用于提取 @builtin 和原生模块）
      # ============================================================
      - name: 📥 Download official
        run: |
          echo "=========================================="
          echo "📥 Download official (for @builtin only)"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"

          echo ""
          echo "Downloading official tar.gz..."
          wget -q --show-progress https://update.code.visualstudio.com/latest/linux-x64/stable -O /tmp/code.tar.gz

          if [ ! -f "/tmp/code.tar.gz" ]; then
            echo "Download failed!"
            exit 1
          fi

          mkdir -p /tmp/code-tar
          echo "Extracting official tar.gz..."
          tar -xzf /tmp/code.tar.gz -C /tmp/code-tar 2>/dev/null

          OFFICIAL_DIR=$(find /tmp/code-tar -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)

          if [ -z "$OFFICIAL_DIR" ] || [ ! -d "$OFFICIAL_DIR" ]; then
            echo "Official VSCode directory not found!"
            exit 1
          fi

          echo "Found official directory: $OFFICIAL_DIR"
          echo "OFFICIAL_DIR=$OFFICIAL_DIR" >> $GITHUB_ENV

      # ============================================================
      # 14. 从官方复制 @builtin 插件（不覆盖自定义二进制）
      # ============================================================
      - name: 📥 Copy @builtin from official
        run: |
          echo "=========================================="
          echo "📥 Copy @builtin from official"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"
          OFFICIAL_DIR="${OFFICIAL_DIR}"

          echo ""
          echo "1. Copy @builtin plugins from official (workbench/contrib)..."
          OFFICIAL_CONTRIB="$OFFICIAL_DIR/resources/app/out/vs/workbench/contrib"
          TARGET_CONTRIB="$BUILD_DIR/resources/app/out/vs/workbench/contrib"

          if [ -d "$OFFICIAL_CONTRIB" ]; then
            mkdir -p "$(dirname $TARGET_CONTRIB)"
            cp -r "$OFFICIAL_CONTRIB" "$(dirname $TARGET_CONTRIB)/"
            echo "   [OK] Copied workbench/contrib from official"

            # 验证 Git
            if [ -d "$TARGET_CONTRIB/git" ]; then
              echo "   [OK] Git exists in workbench/contrib/git"
            else
              echo "   [WARN] Git not found in official contrib"
            fi
          else
            echo "   [FAIL] Official workbench/contrib not found!"
            exit 1
          fi

          echo ""
          echo "2. Copy other @builtin directories from official..."
          OFFICIAL_VS="$OFFICIAL_DIR/resources/app/out/vs"
          TARGET_VS="$BUILD_DIR/resources/app/out/vs"

          for dir in base code editor platform sessions; do
            if [ -d "$OFFICIAL_VS/$dir" ]; then
              cp -r "$OFFICIAL_VS/$dir" "$TARGET_VS/"
              echo "   [OK] Copied $dir from official"
            fi
          done

          echo ""
          echo "3. Copy official node_modules (原生模块)..."
          OFFICIAL_NM=""
          if [ -d "$OFFICIAL_DIR/resources/app/node_modules" ]; then
            OFFICIAL_NM="$OFFICIAL_DIR/resources/app/node_modules"
          elif [ -d "$OFFICIAL_DIR/node_modules" ]; then
            OFFICIAL_NM="$OFFICIAL_DIR/node_modules"
          fi

          if [ -n "$OFFICIAL_NM" ] && [ -d "$OFFICIAL_NM" ]; then
            TARGET_NM="$BUILD_DIR/resources/app/node_modules"
            mkdir -p "$TARGET_NM"

            for module in node-pty @vscode/spdlog @vscode/sqlite3 native-keymap; do
              if [ -d "$OFFICIAL_NM/$module" ]; then
                TARGET_PATH="$TARGET_NM/$(dirname $module 2>/dev/null || echo $module)"
                mkdir -p "$TARGET_PATH"
                rm -rf "$TARGET_PATH/$(basename $module)" 2>/dev/null
                cp -r "$OFFICIAL_NM/$module" "$TARGET_PATH/"
                echo "   [OK] Copied $module from official"
              fi
            done
          fi

      # ============================================================
      # 15. 恢复自定义二进制（保留二开功能）
      # ============================================================
      - name: 📥 Restore custom binary
        run: |
          echo "=========================================="
          echo "📥 Restore custom binary"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"

          echo ""
          echo "1. Restore custom binary (with 二开)..."
          if [ -f "/tmp/backup-custom/tscode.real" ]; then
            rm -f "$BUILD_DIR/code"
            cp "/tmp/backup-custom/tscode.real" "$BUILD_DIR/tscode.real"
            chmod +x "$BUILD_DIR/tscode.real"
            echo "   [OK] tscode.real restored (custom build with 二开)"
          fi

          echo ""
          echo "2. Restore custom extensions..."
          if [ -d "/tmp/backup-custom/extensions" ]; then
            rm -rf "$BUILD_DIR/resources/app/extensions"
            cp -r "/tmp/backup-custom/extensions" "$BUILD_DIR/resources/app/"
            echo "   [OK] extensions restored"
          fi

          echo ""
          echo "3. Restore custom config files..."
          [ -f "/tmp/backup-custom/package.json" ] && cp "/tmp/backup-custom/package.json" "$BUILD_DIR/" && echo "   [OK] package.json"
          [ -f "/tmp/backup-custom/product.json" ] && cp "/tmp/backup-custom/product.json" "$BUILD_DIR/" && echo "   [OK] product.json"

          echo ""
          echo "4. Restore custom snapshot..."
          [ -f "/tmp/backup-custom/snapshot_blob.bin" ] && cp "/tmp/backup-custom/snapshot_blob.bin" "$BUILD_DIR/" && echo "   [OK] snapshot_blob.bin"
          [ -f "/tmp/backup-custom/v8_context_snapshot.bin" ] && cp "/tmp/backup-custom/v8_context_snapshot.bin" "$BUILD_DIR/" && echo "   [OK] v8_context_snapshot.bin"

          echo ""
          echo "5. Restore chrome-sandbox..."
          [ -f "/tmp/backup-custom/chrome-sandbox" ] && cp "/tmp/backup-custom/chrome-sandbox" "$BUILD_DIR/" && chmod 4755 "$BUILD_DIR/chrome-sandbox" 2>/dev/null || true && echo "   [OK] chrome-sandbox"

          echo ""
          echo "6. Create tscode wrapper if missing..."
          if [ ! -f "$BUILD_DIR/tscode" ]; then
            cat > "$BUILD_DIR/tscode" << 'WRAPPER_EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export ELECTRON_ENABLE_GPU=0
          export LIBGL_ALWAYS_SOFTWARE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ELECTRON_DISABLE_SANDBOX=1
          export GDK_BACKEND=x11
          export QT_QPA_PLATFORM=xcb
          export DISPLAY=:0
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          export CRASHPAD_DISABLE=1
          if [ -f "$SCRIPT_DIR/tscode.real" ]; then
              EXEC="$SCRIPT_DIR/tscode.real"
          else
              echo "VSCode executable not found!"
              exit 1
          fi
          USER_DATA_DIR="$SCRIPT_DIR/user-data"
          mkdir -p "$USER_DATA_DIR"
          exec "$EXEC" --no-sandbox --disable-gpu-sandbox --disable-software-rasterizer --disable-gpu --user-data-dir="$USER_DATA_DIR" "$@"
          WRAPPER_EOF
            chmod +x "$BUILD_DIR/tscode"
            echo "   [OK] tscode wrapper created"
          fi

          echo ""
          echo "7. Final verification..."
          echo "   tscode.real: $(if [ -f $BUILD_DIR/tscode.real ]; then echo 'OK (custom)'; else echo 'MISSING'; fi)"
          echo "   Git: $(if [ -d $BUILD_DIR/resources/app/out/vs/workbench/contrib/git ]; then echo 'OK'; else echo 'MISSING'; fi)"
          echo "   node-pty: $(if [ -d $BUILD_DIR/resources/app/node_modules/node-pty ]; then echo 'OK'; else echo 'MISSING'; fi)"

          # 清理
          rm -rf /tmp/backup-custom /tmp/code-tar /tmp/code.tar.gz

      # ============================================================
      # 16. Find and copy prebuilt extensions
      # ============================================================
      - name: 📂 Find and copy prebuilt extensions
        run: |
          echo "=========================================="
          echo "🔍 Find and copy prebuilt extensions"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"
          TARGET_DIR="$BUILD_DIR/resources/app/extensions"
          mkdir -p "$TARGET_DIR"

          if [ -d "./prebuilt-extensions" ]; then
            echo "Found prebuilt-extensions directory"

            VSIX_FILE=""
            for pattern in "./prebuilt-extensions/linux/x64/testagent*.vsix" "./prebuilt-extensions/*testagent*.vsix"; do
              FOUND=$(ls -1 $pattern 2>/dev/null | head -1)
              if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
                VSIX_FILE="$FOUND"
                break
              fi
            done

            if [ -n "$VSIX_FILE" ]; then
              echo "   [OK] testagent: $VSIX_FILE"
              rm -rf "$TARGET_DIR/test-tech.TestAgent" 2>/dev/null
              mkdir -p "$TARGET_DIR/test-tech.TestAgent"
              unzip -q "$VSIX_FILE" -d "$TARGET_DIR/test-tech.TestAgent"
              if [ -d "$TARGET_DIR/test-tech.TestAgent/extension" ]; then
                mv "$TARGET_DIR/test-tech.TestAgent/extension"/* "$TARGET_DIR/test-tech.TestAgent/"
                rm -rf "$TARGET_DIR/test-tech.TestAgent/extension"
              fi
              echo "   [OK] test-tech.TestAgent installed"
            fi

            declare -A EXTS=(
              ["cweijan.vscode-office"]="cweijan.vscode-office-4.1.5.vsix"
              ["test-tech.beeeyes"]="test-tech.beeeyes-0.0.1.vsix"
              ["test-tech.skillhub"]="test-tech.skillhub-1.0.3-uat.vsix"
              ["MS-CEINTL.vscode-language-pack-zh-hans"]="vscode-language-pack-zh-hans-v1.108.0.vsix"
            )

            for ext in "${!EXTS[@]}"; do
              vsix_file="./prebuilt-extensions/${EXTS[$ext]}"
              if [ -f "$vsix_file" ]; then
                echo "   Extracting $ext..."
                rm -rf "$TARGET_DIR/$ext" 2>/dev/null
                mkdir -p "$TARGET_DIR/$ext"
                unzip -q "$vsix_file" -d "$TARGET_DIR/$ext"
                if [ -d "$TARGET_DIR/$ext/extension" ]; then
                  mv "$TARGET_DIR/$ext/extension"/* "$TARGET_DIR/$ext/"
                  rm -rf "$TARGET_DIR/$ext/extension"
                fi
                echo "   [OK] $ext installed"
              fi
            done
          fi

      # ============================================================
      # 17. Package
      # ============================================================
      - name: 📦 Package
        run: |
          echo "=========================================="
          echo "📦 Package"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"

          chmod +x $BUILD_DIR/tscode 2>/dev/null || true
          chmod +x $BUILD_DIR/start-vscode.sh 2>/dev/null || true
          chmod +x $BUILD_DIR/chrome-sandbox 2>/dev/null || true
          chmod +x $BUILD_DIR/tscode.real 2>/dev/null || true

          echo ""
          echo "Pre-package validation:"
          echo "   tscode.real (custom): $(if [ -f $BUILD_DIR/tscode.real ]; then echo 'OK'; else echo 'MISSING'; fi)"
          echo "   Git @builtin: $(if [ -d $BUILD_DIR/resources/app/out/vs/workbench/contrib/git ]; then echo 'OK'; else echo 'MISSING'; fi)"
          echo "   node-pty: $(if [ -d $BUILD_DIR/resources/app/node_modules/node-pty ]; then echo 'OK'; else echo 'MISSING'; fi)"
          echo "   test-tech.TestAgent: $(if [ -d $BUILD_DIR/resources/app/extensions/test-tech.TestAgent ]; then echo 'OK'; else echo 'MISSING'; fi)"
          echo "   extensions count: $(ls -la $BUILD_DIR/resources/app/extensions/ 2>/dev/null | wc -l)"

          tar -czf "vscode-uos-${VERSION}-double-click.tar.gz" \
            --preserve-permissions \
            -C "$(dirname "$BUILD_DIR")" \
            "$(basename "$BUILD_DIR")"

          echo ""
          echo "Package created:"
          ls -lh vscode-uos-*.tar.gz

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vscode-uos-double-click
          path: vscode-uos-*.tar.gz
          retention-days: 30

      - name: 📊 Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ github.event.inputs.version || '1.116.0' }}"
          echo "=========================================="
          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully!"
            echo ""
            echo "Package contains:"
            echo "  - Custom binary (with 二开: login, UI, etc.)"
            echo "  - @builtin plugins from official (Git, GitHub, Markdown, etc.)"
            echo "  - Native modules from official (node-pty, etc.)"
            echo "  - Custom extensions (test-tech.TestAgent, etc.)"
            echo ""
            echo "On UOS:"
            echo "  1. tar -xzf vscode-uos-*.tar.gz"
            echo "  2. cd VSCode-linux-x64"
            echo "  3. ./tscode"
          else
            echo "Build failed. Check logs for details."
          fi
          echo "=========================================="