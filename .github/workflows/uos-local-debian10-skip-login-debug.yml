name: Build Custom VSCode for UOS with Debug Logging

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
      version:
        description: 'Package version'
        required: false
        default: '1.116.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-3-dev libxkbfile-dev \
            libkrb5-dev libgbm-dev rpm libx11-dev libxss-dev libxtst-dev \
            libnss3-dev libasound2-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev \
            python3 git wget curl tree unzip jq

      - name: 🔧 Fix TypeScript scripts
        run: |
          echo 'console.log("Preinstall OK");' > build/npm/preinstall.js
          sed -i 's/"preinstall": "node build\/npm\/preinstall.ts"/"preinstall": "node build\/npm\/preinstall.js"/' package.json
          echo 'console.log("Postinstall OK");' > build/npm/postinstall.js
          sed -i 's/"postinstall": "node build\/npm\/postinstall.ts"/"postinstall": "node build\/npm\/postinstall.js"/' package.json

      - name: 📦 Install dependencies
        run: |
          echo "=========================================="
          echo "📦 Installing dependencies"
          echo "=========================================="
          npm install --legacy-peer-deps

      - name: 📦 Install build tools
        run: |
          npm install -g tsx
          npm install --legacy-peer-deps \
            ternary-stream vscode-gulp-watch esbuild jsonc-parser \
            gulp-merge-json gulp-tsb gulp-sourcemaps gulp-filter \
            gulp-rename gulp-sort 2>/dev/null || true

      - name: 🔧 Fix extensions.ts
        run: |
          cat > build/lib/extensions.ts << 'EOF'
          import { Stream } from "stream";
          const empty: any[] = [];
          function emptyStream(): Stream {
            const s = new Stream.Readable();
            s._read = () => s.push(null);
            return s;
          }
          export function isWebExtension(): boolean { return false; }
          export function getExtensionStream(): Stream { return emptyStream(); }
          export function getExtensionDownloadStream(): Stream { return emptyStream(); }
          export function packageMarketplaceExtensionsStream(): Stream { return emptyStream(); }
          export function packageNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageNonNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageExtensionsStream(): Stream { return emptyStream(); }
          export function packageCopilotExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotChatExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotAgentsExtensionStream(): Stream { return emptyStream(); }
          export function fromMarketplace(): any[] { return empty; }
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }
          export function buildExtensionMedia(): void {}
          export function compileExtensionMedia(): void {}
          export function buildExtensionMediaTask(done: any): void { done(); }
          export const builtInExtensions = empty;
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions = empty;
          export const shouldDownloadWebBuiltInExtensions = false;
          EOF
          echo 'export const builtInExtensions: any[] = [];
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions: any[] = [];
          export const shouldDownloadWebBuiltInExtensions = false;' > build/lib/builtInExtensions.ts
          echo 'import { Stream } from "stream";
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }' > build/lib/fetch.ts

      - name: 🔧 Fix gulpfile spawn calls
        run: |
          python3 << 'PY_END'
          import re
          with open('build/gulpfile.vscode.ts', 'r') as f:
              content = f.read()
          content = re.sub(r"spawn\('node'", "spawn('tsx'", content)
          content = re.sub(r'spawn\("node"', 'spawn("tsx"', content)
          content = re.sub(r"spawn\(process\.execPath", "spawn('tsx'", content)
          with open('build/gulpfile.vscode.ts', 'w') as f:
              f.write(content)
          print("spawn calls fixed")
          PY_END

      - name: 🔧 Replace copilot.ts
        run: |
          cat > build/lib/copilot.ts << 'EOF'
          export async function prepareBuiltInCopilotExtensionShims(extRoot: string): Promise<void> {
              console.log('Copilot extension shims preparation skipped for UOS build');
              return;
          }
          export function copyCopilotNativeDeps(productRoot: string): void {
              console.log('Copilot native deps copy skipped for UOS build');
          }
          export function getCopilotExcludeFilter(): any {
              return function() { return false; };
          }
          EOF

      - name: 🔧 Disable Crashpad
        run: |
          echo "Disabling Crashpad"
          python3 << 'PY_JSON_END'
          import json
          import os
          if os.path.exists('product.json'):
              with open('product.json', 'r') as f:
                  data = json.load(f)
              data['enableCrashReport'] = False
              if 'crashReporter' not in data:
                  data['crashReporter'] = {}
              data['crashReporter']['disabled'] = True
              with open('product.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print("product.json modified")
          PY_JSON_END

          mkdir -p src/vs/platform/crash/common
          cat > src/vs/platform/crash/common/crashService.ts << 'CRASH_EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/
          import { createDecorator } from '../../../base/common/instantiation.js';
          export const ICrashService = createDecorator<ICrashService>('crashService');
          export interface ICrashService { _serviceBrand: undefined; }
          export class CrashService implements ICrashService {
              declare readonly _serviceBrand: undefined;
              constructor() { console.log('Crash service disabled for UOS build'); }
          }
          CRASH_EOF
          echo "crashService.ts created"

      - name: ⚙️ Set env
        run: |
          echo "VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_ELECTRON_SKIP_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_PRELAUNCH=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_BUNDLED_EXTENSIONS=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTER=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTING=1" >> $GITHUB_ENV

      - name: 🔨 Build VSCode
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1
          export VSCODE_ELECTRON_SKIP_DOWNLOAD=1
          export VSCODE_SKIP_PRELAUNCH=1
          export VSCODE_SKIP_BUNDLED_EXTENSIONS=1
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          echo "Start: $(date)"
          npx tsx node_modules/gulp/bin/gulp.js vscode-linux-x64 --no-color
          echo "Done: $(date)"

      - name: 🔍 Verify build contents
        run: |
          echo "=========================================="
          echo "🔍 Verify build contents"
          echo "=========================================="

          BUILD_DIR=""
          for dir in "./VSCode-linux-x64" "./vscode/VSCode-linux-x64" "../VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              BUILD_DIR="$dir"
              echo "Found build directory: $BUILD_DIR"
              break
            fi
          done

          if [ -z "$BUILD_DIR" ]; then
            echo "Build directory not found!"
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

      - name: 📦 Copy node_modules to resources/app
        run: |
          echo "=========================================="
          echo "📦 Copy node_modules to resources/app"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"

          if [ ! -d "./node_modules" ]; then
            echo "❌ node_modules not found in root!"
            echo "Installing node_modules..."
            npm install --legacy-peer-deps
          fi

          echo "📌 Copying node_modules to $BUILD_DIR/resources/app/"
          rm -rf "$BUILD_DIR/resources/app/node_modules"
          cp -r ./node_modules "$BUILD_DIR/resources/app/"

          echo ""
          echo "📌 Verifying node_modules:"
          for module in @vscode/spdlog @vscode/sqlite3 native-keymap node-pty; do
            if [ -d "$BUILD_DIR/resources/app/node_modules/$module" ]; then
              echo "   ✅ $module"
            else
              echo "   ⚠️ $module (missing)"
            fi
          done

      - name: 📂 Copy extensions
        run: |
          echo "=========================================="
          echo "📂 Copy extensions"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"
          mkdir -p "$BUILD_DIR/resources/app/extensions"

          # 从源码复制 extensions
          if [ -d "./extensions" ]; then
            echo "📌 Copying extensions from source..."
            for dir in ./extensions/*; do
              if [ -d "$dir" ]; then
                dir_name=$(basename "$dir")
                echo "   Processing $dir_name..."
                cp -r "$dir" "$BUILD_DIR/resources/app/extensions/"
              fi
            done
            echo "   ✅ extensions copied"
          fi

          # 下载官方 VSCode 扩展
          echo ""
          echo "📌 Downloading official VSCode extensions..."
          wget -q --show-progress https://update.code.visualstudio.com/latest/linux-x64/stable -O /tmp/official.tar.gz
          tar -xzf /tmp/official.tar.gz -C /tmp/ 2>/dev/null
          OFFICIAL_DIR=$(find /tmp -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)

          if [ -n "$OFFICIAL_DIR" ] && [ -d "$OFFICIAL_DIR/resources/app/extensions" ]; then
            echo "   ✅ Found official extensions directory"
            cp -r "$OFFICIAL_DIR/resources/app/extensions/"* "$BUILD_DIR/resources/app/extensions/"
            echo "   ✅ Extensions copied from official build"
          fi

          rm -rf /tmp/official.tar.gz /tmp/VSCode-linux-x64

      - name: 🔍 Verify extensions before packaging
        run: |
          echo "=========================================="
          echo "🔍 Verify extensions before packaging"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"
          EXT_DIR="$BUILD_DIR/resources/app/extensions"

          echo ""
          echo "📁 Extensions directory: $EXT_DIR"
          echo "   Total extensions: $(ls -1 $EXT_DIR 2>/dev/null | wc -l)"
          echo ""
          echo "📋 Extensions list:"
          ls -la "$EXT_DIR" | head -20

          echo ""
          echo "📄 Checking package.json for each extension:"
          for ext in "$EXT_DIR"/*; do
            if [ -d "$ext" ] && [ -f "$ext/package.json" ]; then
              NAME=$(basename "$ext")
              MAIN=$(jq -r '.main // "N/A"' "$ext/package.json" 2>/dev/null)
              ACTIVATION=$(jq -r '.activationEvents // [] | length' "$ext/package.json" 2>/dev/null)
              echo "   $NAME: main=$MAIN, activationEvents=$ACTIVATION"
            fi
          done | head -30

          echo ""
          echo "📄 Creating extension manifest..."
          cat > "$EXT_DIR/.extensions.json" << 'MANIFEST_EOF'
          {
            "extensions": [
          MANIFEST_EOF

          for ext in "$EXT_DIR"/*; do
            if [ -d "$ext" ] && [ -f "$ext/package.json" ]; then
              NAME=$(basename "$ext")
              VERSION=$(jq -r '.version // "unknown"' "$ext/package.json" 2>/dev/null)
              MAIN=$(jq -r '.main // "N/A"' "$ext/package.json" 2>/dev/null)
              echo "    {\"name\":\"$NAME\",\"version\":\"$VERSION\",\"main\":\"$MAIN\"}," >> "$EXT_DIR/.extensions.json"
            fi
          done
          sed -i '$ s/,$//' "$EXT_DIR/.extensions.json"
          echo "  ]" >> "$EXT_DIR/.extensions.json"
          echo "}" >> "$EXT_DIR/.extensions.json"

          echo "   ✅ Extension manifest created"

      - name: 🚀 Create startup scripts with comprehensive logging
        run: |
          echo "=========================================="
          echo "🚀 Create startup scripts with comprehensive logging"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"
          cd "$BUILD_DIR"

          # 找到可执行文件
          REAL_EXEC=""
          for name in code code-oss; do
            if [ -f "./$name" ]; then
              REAL_EXEC="$name"
              break
            fi
          done

          if [ -z "$REAL_EXEC" ]; then
            REAL_EXEC=$(find . -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.sh" ! -name "chrome-*" 2>/dev/null | head -1)
          fi

          if [ -z "$REAL_EXEC" ]; then
            echo "❌ No executable found!"
            exit 1
          fi

          echo "✅ Found executable: $REAL_EXEC"
          mv "$REAL_EXEC" "tscode.real"

          # 创建主启动脚本
          cat > tscode << 'WRAPPER_EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          LOG_FILE="$SCRIPT_DIR/vscode-debug.log"

          # 日志函数
          log() {
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] $*" | tee -a "$LOG_FILE"
          }

          log "=========================================="
          log "TSCode Startup with Debug Logging"
          log "=========================================="
          log "Script dir: $SCRIPT_DIR"
          log "User: $(whoami)"
          log "Date: $(date)"

          # 设置环境变量
          export ELECTRON_ENABLE_GPU=0
          export LIBGL_ALWAYS_SOFTWARE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ELECTRON_DISABLE_SANDBOX=1
          export GDK_BACKEND=x11
          export QT_QPA_PLATFORM=xcb
          export DISPLAY=:0
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          export CRASHPAD_DISABLE=1

          export VSCODE_APP_NAME="TSCode"
          export VSCODE_APP_VERSION="1.116.0"

          export NODE_DEBUG=vscode*
          export ELECTRON_DEBUG_EXTENSIONS=1
          export VSCODE_DEBUG_EXTENSIONS=1

          # ==========================================
          # 日志：目录结构
          # ==========================================
          log ""
          log "=== DIRECTORY STRUCTURE ==="
          log "Current directory contents:"
          ls -la "$SCRIPT_DIR" >> "$LOG_FILE" 2>&1

          log ""
          log "=== RESOURCES/APP DIRECTORY ==="
          if [ -d "$SCRIPT_DIR/resources/app" ]; then
              ls -la "$SCRIPT_DIR/resources/app" >> "$LOG_FILE" 2>&1
          else
              log "ERROR: resources/app not found!"
          fi

          # ==========================================
          # 日志：扩展信息
          # ==========================================
          log ""
          log "=== EXTENSIONS INFORMATION ==="
          EXT_DIR="$SCRIPT_DIR/resources/app/extensions"
          if [ -d "$EXT_DIR" ]; then
              EXT_COUNT=$(ls -1 "$EXT_DIR" 2>/dev/null | wc -l)
              log "Extension directory: $EXT_DIR"
              log "Total extensions: $EXT_COUNT"

              log ""
              log "Extension list with details:"
              for ext in "$EXT_DIR"/*; do
                  if [ -d "$ext" ] && [ -f "$ext/package.json" ]; then
                      NAME=$(basename "$ext")
                      VERSION=$(jq -r '.version // "unknown"' "$ext/package.json" 2>/dev/null)
                      MAIN=$(jq -r '.main // "N/A"' "$ext/package.json" 2>/dev/null)
                      ACTIVATION=$(jq -r '.activationEvents // [] | length' "$ext/package.json" 2>/dev/null)
                      MAIN_EXISTS=""
                      if [ "$MAIN" != "N/A" ] && [ -f "$ext/$MAIN" ]; then
                          MAIN_EXISTS=" (exists)"
                      elif [ "$MAIN" != "N/A" ]; then
                          MAIN_EXISTS=" (MISSING!)"
                      fi
                      log "  $NAME: v$VERSION, main=$MAIN$MAIN_EXISTS, activationEvents=$ACTIVATION"
                  fi
              done | head -50

              log ""
              log "Extension manifest (.extensions.json):"
              if [ -f "$EXT_DIR/.extensions.json" ]; then
                  cat "$EXT_DIR/.extensions.json" >> "$LOG_FILE" 2>&1
              else
                  log "  No manifest file found"
              fi
          else
              log "ERROR: Extensions directory not found at $EXT_DIR"
          fi

          # ==========================================
          # 日志：node_modules
          # ==========================================
          log ""
          log "=== NODE_MODULES ==="
          NODE_MODULES="$SCRIPT_DIR/resources/app/node_modules"
          if [ -d "$NODE_MODULES" ]; then
              log "node_modules found at: $NODE_MODULES"
              log "Size: $(du -sh "$NODE_MODULES" 2>/dev/null | cut -f1)"
              log "Top modules:"
              ls -la "$NODE_MODULES" | head -20 >> "$LOG_FILE" 2>&1

              log ""
              log "Critical modules:"
              for module in @vscode/sqlite3 @vscode/spdlog native-keymap node-pty; do
                  if [ -d "$NODE_MODULES/$module" ]; then
                      log "  ✅ $module"
                  else
                      log "  ❌ $module (missing)"
                  fi
              done
          else
              log "ERROR: node_modules not found at $NODE_MODULES"
          fi

          # ==========================================
          # 日志：Product.json
          # ==========================================
          log ""
          log "=== PRODUCT.JSON ==="
          if [ -f "$SCRIPT_DIR/resources/app/product.json" ]; then
              cat "$SCRIPT_DIR/resources/app/product.json" | jq '.nameShort, .version, .enableCrashReport' >> "$LOG_FILE" 2>&1
          else
              log "product.json not found"
          fi

          # ==========================================
          # 创建用户数据目录
          # ==========================================
          USER_DATA_DIR="$SCRIPT_DIR/user-data"
          mkdir -p "$USER_DATA_DIR"
          mkdir -p "$USER_DATA_DIR/extensions"
          log ""
          log "User data dir: $USER_DATA_DIR"
          log "User extensions dir: $USER_DATA_DIR/extensions"

          # ==========================================
          # 检查可执行文件
          # ==========================================
          EXEC="$SCRIPT_DIR/tscode.real"
          if [ ! -f "$EXEC" ]; then
              log "ERROR: tscode.real not found!"
              exit 1
          fi
          log "Executable: $EXEC"
          log "Executable permissions: $(ls -la $EXEC)"

          # ==========================================
          # 构建启动命令
          # ==========================================
          log ""
          log "=== LAUNCHING VSCode ==="
          CMD=(
              "$EXEC"
              --no-sandbox
              --disable-gpu-sandbox
              --disable-software-rasterizer
              --disable-gpu
              --user-data-dir="$USER_DATA_DIR"
              --builtin-extensions-dir="$EXT_DIR"
              --extensions-dir="$USER_DATA_DIR/extensions"
              --enable-extensions
              --verbose
              --log-level=debug
              "$@"
          )
          log "Command: ${CMD[*]}"

          log ""
          log "Starting VSCode at $(date)"
          log "=========================================="

          # 启动并记录输出
          "${CMD[@]}" 2>&1 | tee -a "$LOG_FILE"
          EXIT_CODE=$?

          log ""
          log "=========================================="
          log "VSCode exited with code: $EXIT_CODE"
          log "=========================================="

          exit $EXIT_CODE
          WRAPPER_EOF

          chmod +x tscode
          chmod +x tscode.real

          # ==========================================
          # 创建诊断脚本
          # ==========================================
          cat > diagnose-extensions.sh << 'DIAG_EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          echo "=========================================="
          echo "TSCode Extension Diagnostic Tool"
          echo "=========================================="

          echo ""
          echo "=== System Information ==="
          echo "OS: $(cat /etc/os-release | grep PRETTY_NAME | cut -d'"' -f2)"
          echo "GLIBC: $(ldd --version | head -1)"
          echo "Node: $(node --version 2>/dev/null || echo 'Not found')"

          echo ""
          echo "=== Extension Directories ==="
          for dir in \
              "$SCRIPT_DIR/resources/app/extensions" \
              "$SCRIPT_DIR/user-data/extensions" \
              "$HOME/.tscode/extensions" \
              "$HOME/.config/tscode/extensions" \
              "$HOME/.vscode/extensions"
          do
              if [ -d "$dir" ]; then
                  COUNT=$(ls -1 "$dir" 2>/dev/null | wc -l)
                  echo "  ✅ $dir ($COUNT extensions)"
              else
                  echo "  ❌ $dir (not found)"
              fi
          done

          echo ""
          echo "=== VSCode Extension List ==="
          if [ -f "$SCRIPT_DIR/tscode.real" ]; then
              echo "Running: tscode.real --list-extensions --show-versions"
              timeout 10 "$SCRIPT_DIR/tscode.real" \
                  --no-sandbox \
                  --list-extensions \
                  --show-versions \
                  2>&1 | grep -v "libva" | grep -v "ERROR" | head -50
          fi

          echo ""
          echo "=== Check Extension Structure ==="
          EXT_DIR="$SCRIPT_DIR/resources/app/extensions"
          if [ -d "$EXT_DIR" ]; then
              echo "First 10 extensions:"
              for ext in $(ls -1 "$EXT_DIR" | head -10); do
                  if [ -f "$EXT_DIR/$ext/package.json" ]; then
                      NAME=$(jq -r '.name // "N/A"' "$EXT_DIR/$ext/package.json" 2>/dev/null)
                      MAIN=$(jq -r '.main // "N/A"' "$EXT_DIR/$ext/package.json" 2>/dev/null)
                      if [ "$MAIN" != "N/A" ] && [ -f "$EXT_DIR/$ext/$MAIN" ]; then
                          echo "  ✅ $ext: $NAME ($MAIN exists)"
                      else
                          echo "  ❌ $ext: $NAME ($MAIN missing)"
                      fi
                  else
                      echo "  ⚠️ $ext: No package.json"
                  fi
              done
          fi

          echo ""
          echo "=========================================="
          DIAG_EOF

          chmod +x diagnose-extensions.sh

          echo "✅ Startup scripts with comprehensive logging created"

      - name: 📄 Copy config files to root
        run: |
          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"
          cd "$BUILD_DIR"
          [ -f "resources/app/package.json" ] && cp "resources/app/package.json" . && echo "✅ package.json"
          [ -f "resources/app/product.json" ] && cp "resources/app/product.json" . && echo "✅ product.json"

      - name: 📦 Package
        run: |
          echo "=========================================="
          echo "📦 Package"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./VSCode-linux-x64}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"

          chmod +x $BUILD_DIR/tscode 2>/dev/null || true
          chmod +x $BUILD_DIR/diagnose-extensions.sh 2>/dev/null || true
          chmod +x $BUILD_DIR/chrome-sandbox 2>/dev/null || true
          chmod +x $BUILD_DIR/tscode.real 2>/dev/null || true

          echo ""
          echo "📌 Pre-package validation:"
          echo "   node_modules: $(if [ -d $BUILD_DIR/resources/app/node_modules ]; then echo 'OK'; else echo 'MISSING!'; fi)"
          echo "   extensions: $(ls -la $BUILD_DIR/resources/app/extensions/ 2>/dev/null | wc -l)"

          tar -czf "vscode-uos-${VERSION}-debug.tar.gz" \
            --preserve-permissions \
            -C "$(dirname "$BUILD_DIR")" \
            "$(basename "$BUILD_DIR")"

          echo ""
          echo "✅ Package created:"
          ls -lh vscode-uos-*.tar.gz

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vscode-uos-debug
          path: vscode-uos-*.tar.gz
          retention-days: 30

      - name: 📊 Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ github.event.inputs.version || '1.116.0' }}"
          echo "=========================================="
          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully!"
            echo ""
            echo "📁 Package: vscode-uos-*.tar.gz"
            echo ""
            echo "On UOS, after extracting:"
            echo "  1. tar -xzf vscode-uos-*.tar.gz"
            echo "  2. cd VSCode-linux-x64"
            echo "  3. ./tscode (starts with debug logging)"
            echo "  4. ./diagnose-extensions.sh (diagnostic tool)"
            echo "  5. Check vscode-debug.log for details"
          fi
          echo "=========================================="